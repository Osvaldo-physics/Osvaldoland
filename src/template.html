<title>OsvaldoLand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
@font-face{font-family:'Material Symbols Rounded';font-style:normal;font-weight:400 800;font-display:block;src:url(data:font/woff2;base64,__ICONES__) format('woff2')}
/* Palco fixo de 1920×1080 (TV/projetor), escalado para caber na janela. Visual único, escuro, de game show.
   Tokens abaixo seguem o design OsvaldoLand (Claude Design). */
:root{
  color-scheme: dark;
  --noite:#1E1B4B; --noite-2:#0F0C3A; --tinta:#1E1B4B; --tinta-2:#4A477A; --tinta-3:#6B6890;
  --linha:#D9D7EE; --suave:#F1F0FA; --suave-2:#EEEDF6; --indigo:#4F46E5; --indigo-esc:#3730A3;
  --ouro:#FFD23F; --ouro-esc:#C99A00; --lilas:#B9B6E8;
  --baloo:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --nunito:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%}
body{
  margin:0; background:var(--noite-2); color:#fff; overflow:hidden; box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0;
  display:flex; align-items:center; justify-content:center; font-family:var(--nunito);
}
#moldura{position:relative; flex:none; border-radius:10px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.06)}
#palco{position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; color:var(--tinta); font-family:var(--nunito); background:var(--noite)}
#tela,#fx,#sobre{position:absolute; inset:0}
#tela{isolation:isolate; z-index:0} #fx{z-index:1} #sobre{z-index:2}
#l-tab{z-index:0} #l-frente{z-index:1}
#fx{pointer-events:none} #fx .clicavel{pointer-events:auto}
#sobre:empty{display:none}
.abs{position:absolute}
.bal{font-family:var(--baloo); font-weight:800; line-height:1}
.ms{font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; display:inline-block; font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; overflow:hidden; flex:none}
.rotulo{font-weight:900; font-size:28px; letter-spacing:3px; color:var(--tinta-3)}
.flex1{flex:1}
.linha{display:flex; align-items:center}

/* Botões */
button{font:inherit; color:inherit; background:none; border:none; padding:0; margin:0; cursor:pointer; text-align:inherit}
button:focus-visible,input:focus-visible,.foco:focus-visible{outline:6px solid #FDE047; outline-offset:5px}
button[disabled]{cursor:not-allowed}
.b3d{transition:transform .08s ease, box-shadow .08s ease, background .12s ease; display:flex; align-items:center; justify-content:center; gap:14px; font-family:var(--baloo); font-weight:800; line-height:1}
.b3d .ms{margin-top:-4px}
.amarelo{background:var(--ouro); color:var(--tinta); border-radius:24px; box-shadow:0 8px 0 var(--ouro-esc),0 16px 28px rgba(10,8,40,.25)}
.amarelo:hover{transform:translateY(-3px); background:#FFDC5E; box-shadow:0 11px 0 var(--ouro-esc),0 20px 32px rgba(10,8,40,.3)}
.amarelo:active{transform:translateY(6px); box-shadow:0 2px 0 var(--ouro-esc)}
.branco{background:#fff; color:#312E81; border-radius:24px; box-shadow:0 9px 0 var(--lilas)}
.branco:hover{transform:translateY(-3px)}
.branco:active{transform:translateY(7px); box-shadow:0 2px 0 var(--lilas)}
.verde{background:linear-gradient(180deg,#4ADE80,#22C55E 60%); color:#052E16; border-radius:30px; box-shadow:0 12px 0 #15803D,0 0 60px rgba(34,197,94,.45)}
.verde:hover{transform:translateY(-4px)}
.verde:active{transform:translateY(10px); box-shadow:0 2px 0 #15803D}
.roxo{background:var(--indigo); color:#fff; border-radius:22px; box-shadow:0 8px 0 var(--indigo-esc)}
.roxo:hover{transform:translateY(-3px); background:#5B52F0}
.roxo:active{transform:translateY(6px); box-shadow:0 2px 0 var(--indigo-esc)}
.b3d[disabled]{opacity:.45; transform:none!important; filter:grayscale(.4)}
.link{display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:28px; color:#4338CA; text-decoration:underline; text-underline-offset:5px}
.link:hover{color:var(--tinta)}

/* Peças e casas */
.peao{display:inline-block; position:relative; flex:none; vertical-align:bottom}
.peao svg{display:block; overflow:visible; width:100%; height:100%}
.casa{position:relative; display:inline-block; flex:none}
.casa-f{position:absolute; inset:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; overflow:hidden}
.casa-d{position:absolute; animation:anel 1.3s ease-in-out infinite}

/* Cronômetro */
.crono{position:relative; flex:none}
.crono-disco{position:absolute; inset:0; border-radius:50%; border:8px solid #fff; box-sizing:border-box; box-shadow:0 10px 0 rgba(30,27,75,.18),0 18px 34px rgba(10,8,40,.25)}
.crono svg{position:absolute; inset:0; transform:rotate(-90deg)}
.crono-arco{transition:stroke-dashoffset 1s linear}
.crono-c{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.crono.alerta{animation:pulsa 1s ease-in-out infinite}

/* Tabuleiro */
.tab{position:relative; width:1160px; height:716px; border-radius:36px; overflow:hidden; background:linear-gradient(180deg,#25AED6 0%,#1583B5 100%); box-shadow:0 0 0 6px rgba(255,255,255,.9),0 24px 60px rgba(8,6,35,.55)}
.pc{position:absolute; left:0; top:0; transition:transform .2s ease; will-change:transform}
/* 4+ peões na mesma casa: o da vez (ou o que está se movendo) fica inteiro; os outros viram bolinhas numeradas ao lado */
.pc-bola{display:none; position:absolute; left:0; top:0; width:var(--b,38px); height:var(--b,38px); font-size:calc(var(--b,38px)*.56); box-sizing:border-box; border-radius:50%; border:3px solid #fff; align-items:center; justify-content:center; font-family:var(--baloo); font-weight:800; line-height:1; padding-top:.12em}
.pc.bola .peao{display:none}
.pc.bola .pc-bola{display:flex}
/* seta sobre o peão do jogador da vez */
.seta-vez{position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; z-index:99999; transition:transform .2s ease}
.seta-vez b{position:absolute; left:-26px; top:-50px; width:52px; height:46px; animation:seta-vez .9s ease-in-out infinite}
.seta-vez b::before,.seta-vez b::after{content:""; position:absolute; clip-path:polygon(0 0,100% 0,50% 100%)}
.seta-vez b::before{inset:0; background:#fff}
.seta-vez b::after{inset:6px 8px 11px; background:var(--c)}
@keyframes seta-vez{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
/* casas especiais que o jogador da vez já usou */
.usada{position:absolute; pointer-events:none}
.usada i{position:absolute; inset:0; border-radius:50%; background:rgba(30,27,75,.55)}
.usada b{position:absolute; right:-10px; top:-10px; width:36px; height:36px; box-sizing:border-box; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(10,8,40,.4)}
/* faixa "Vez de…" no começo de cada turno */
.anuncio{position:absolute; left:0; right:0; top:400px; height:280px; display:flex; align-items:center; pointer-events:none; animation:anuncio 1.8s cubic-bezier(.3,1.2,.5,1) both}
.anuncio > div{width:100%; height:240px; box-sizing:border-box; border-top:8px solid #fff; border-bottom:8px solid #fff; display:flex; align-items:center; justify-content:center; gap:34px}
.anuncio > div > *{animation:anuncio-txt 1.8s ease-out both}
@keyframes anuncio{0%{opacity:0; transform:scaleY(0)}12%{opacity:1; transform:scaleY(1)}80%{opacity:1; transform:scaleY(1)}100%{opacity:0; transform:scaleY(.7)}}
@keyframes anuncio-txt{0%{transform:translateX(-140px); opacity:0}16%{transform:none; opacity:1}100%{transform:translateX(50px)}}
#l-tab.desfocado{filter:blur(10px); opacity:.7}
#tab-casas,#tab-marcas,#tab-usadas,#tab-mov,#tab-pecas{position:absolute; inset:0}
#tab-marcas,#tab-usadas,#tab-mov,#tab-pecas{pointer-events:none}

/* Mesa */
.topo{position:absolute; left:28px; top:24px; width:1864px; height:100px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center}
.pill-vidro{height:58px; padding:0 22px; box-sizing:border-box; border-radius:999px; background:rgba(255,255,255,.12); border:3px solid rgba(255,255,255,.28); display:flex; align-items:center; gap:10px; color:#fff; font-weight:800; font-size:28px; white-space:nowrap}
.painel{position:absolute; left:1208px; top:144px; width:684px; height:716px; box-sizing:border-box; border-radius:28px; background:rgba(255,255,255,.96); border:6px solid var(--b,#EF4444); box-shadow:0 0 0 5px rgba(255,255,255,.22),0 0 60px var(--g,transparent),0 24px 60px rgba(8,6,35,.5); padding:26px 30px 30px; display:flex; flex-direction:column; gap:16px; animation:entra .28s ease-out}
.cartoes{position:absolute; left:28px; top:884px; width:1864px; height:176px; display:grid; gap:20px}
.cartao{position:relative; height:176px; box-sizing:border-box; border-radius:24px; background:rgba(255,255,255,.96); display:flex; align-items:center; gap:16px; padding:0 20px; min-width:0; transition:transform .2s}
.op-linha{flex:none; box-sizing:border-box; border-radius:24px; display:flex; align-items:center; gap:18px; padding:0 20px 0 22px; font-family:inherit; text-align:left; transition:transform .1s ease, box-shadow .1s ease}
button.op-linha:hover{transform:translateX(-8px) scale(1.02)}
button.op-linha:active{transform:translateY(6px)}
.raios{position:absolute; left:50%; top:50%; width:1000px; height:1000px; margin:-500px 0 0 -500px; animation:gira 50s linear infinite; will-change:transform}
.brilho-pulsa{animation:brilha 2.4s ease-in-out infinite; will-change:transform,opacity}
.dif{flex:none; box-sizing:border-box; border:5px solid #fff; border-radius:28px; display:flex; align-items:center; gap:20px; padding:0 18px 0 30px; text-align:left; transition:transform .1s, box-shadow .1s}
.dif:hover{transform:translateY(-3px) scale(1.02)}
.dif:active{transform:translateY(7px)}
.dif .estrelas .ms{animation:acende .35s both}
.cat-card{position:relative; box-sizing:border-box; border-radius:26px; background:#fff; overflow:hidden; display:flex; flex-direction:column; padding:0; transition:transform .12s, box-shadow .12s; animation:entra .35s both}
.cat-card:hover{transform:translateY(-8px) scale(1.03)}
.cat-card:active{transform:translateY(6px)}

/* Duelo */
.podio{position:relative; box-sizing:border-box; border-radius:30px; display:flex; align-items:center; gap:28px; padding:0 40px; font-family:inherit; transition:transform .12s}
button.podio:not([disabled]):hover{transform:translateY(-4px)}
button.podio:not([disabled]):active{transform:translateY(8px)}
.podio[disabled]{cursor:not-allowed}
.selo{animation:selo .5s cubic-bezier(.3,1.6,.5,1) both}
.todos-card{box-sizing:border-box; border-radius:30px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:10px; padding:0 8px 22px; font-family:inherit; transition:transform .12s}
.todos-card:not([disabled]){animation:balanca 1.6s ease-in-out infinite}
.todos-card:not([disabled]):hover{transform:translateY(-6px) scale(1.03); animation:none}
.todos-card[disabled]{opacity:.4; filter:grayscale(.6); cursor:not-allowed}
.alerta-borda{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 16px #EF4444,inset 0 0 160px rgba(239,68,68,.75); animation:pisca 1s ease-in-out infinite}
.vira{animation:vira .35s ease-out both; transform-origin:50% 0}
.simnao{height:180px; box-sizing:border-box; border:6px solid #fff; border-radius:34px; display:flex; align-items:center; justify-content:center; gap:20px; font-family:var(--baloo); font-weight:800; font-size:96px; line-height:1; transition:transform .1s, box-shadow .1s}
.simnao:hover{transform:translateY(-4px)}
.simnao:active{transform:translateY(10px)}

/* Overlays */
.veu{position:absolute; inset:0; background:rgba(12,10,40,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; animation:fade .18s ease-out}
.modal{position:absolute; box-sizing:border-box; border-radius:36px; background:#fff; border:6px solid var(--indigo); box-shadow:0 0 0 6px rgba(255,255,255,.3),0 30px 80px rgba(0,0,0,.5); display:flex; flex-direction:column; animation:mola .3s cubic-bezier(.3,1.5,.5,1) both}
.chip{height:72px; padding:0 28px; box-sizing:border-box; border-radius:999px; border:4px solid var(--linha); display:flex; align-items:center; gap:8px; font-weight:800; font-size:30px; color:var(--tinta-2); background:#fff; transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--indigo); border-color:var(--indigo); color:#fff; font-weight:900; box-shadow:0 5px 0 var(--indigo-esc)}
.seg{height:80px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:var(--baloo); font-weight:800; font-size:40px; line-height:1; color:var(--tinta-2)}
.seg.on{background:var(--indigo); box-shadow:0 5px 0 var(--indigo-esc); color:#fff}
.seg[disabled]{opacity:.4}
.chave{width:116px; height:64px; box-sizing:border-box; border-radius:999px; padding:6px; display:flex; flex:none; box-shadow:inset 0 3px 0 rgba(0,0,0,.12); transition:background .15s}
.chave span.bola{width:52px; height:52px; border-radius:50%; background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
input[type=range].faixa{-webkit-appearance:none; appearance:none; width:100%; height:80px; background:transparent; margin:0; cursor:pointer}
input[type=range].faixa::-webkit-slider-runnable-track{height:20px; border-radius:999px; background:linear-gradient(90deg,var(--indigo) var(--p),#E4E2F3 var(--p))}
input[type=range].faixa::-moz-range-track{height:20px; border-radius:999px; background:#E4E2F3}
input[type=range].faixa::-moz-range-progress{height:20px; border-radius:999px; background:var(--indigo)}
input[type=range].faixa::-webkit-slider-thumb{-webkit-appearance:none; width:64px; height:64px; margin-top:-22px; box-sizing:border-box; border-radius:50%; background:#fff; border:8px solid var(--indigo); box-shadow:0 5px 0 var(--indigo-esc)}
input[type=range].faixa::-moz-range-thumb{width:48px; height:48px; border-radius:50%; background:#fff; border:8px solid var(--indigo); box-shadow:0 5px 0 var(--indigo-esc)}

/* Cadastro */
.jog-linha{box-sizing:border-box; border-radius:24px; background:rgba(255,255,255,.96); box-shadow:0 8px 0 rgba(10,8,40,.35); display:flex; align-items:center; gap:22px; padding:0 22px 0 18px; animation:entra .25s ease-out both}
.nome-caixa{width:380px; height:80px; box-sizing:border-box; border-radius:18px; background:#F6F5FD; border:4px solid var(--linha); display:flex; align-items:center; padding:0 18px; gap:10px}
.nome-caixa:focus-within{border-color:var(--indigo); background:#fff}
.nome-caixa input{flex:1; min-width:0; border:none; background:transparent; outline:none; font-family:var(--baloo); font-weight:800; font-size:44px; line-height:1; color:var(--tinta); padding:6px 0 0}
.bolinha{position:relative; width:62px; height:62px; box-sizing:border-box; border-radius:50%; border:4px solid #fff; display:flex; align-items:center; justify-content:center; transition:transform .1s}
.bolinha:not([disabled]):hover{transform:scale(1.1)}
.risco{position:absolute; left:-6px; right:-6px; top:50%; height:7px; margin-top:-3.5px; border-radius:4px; background:var(--tinta); transform:rotate(-45deg); box-shadow:0 0 0 2px #fff}
.x-btn{width:72px; height:72px; border-radius:20px; background:var(--suave); color:var(--tinta-2); display:flex; align-items:center; justify-content:center; flex:none}
.x-btn:hover{background:#FEE2E2; color:#B91C1C}

/* Abertura e sorteio */
.logo-svg{animation:mola .7s cubic-bezier(.3,1.5,.5,1) both}
.placa{animation:placa 3.2s ease-in-out infinite; transform-origin:50% 0}
.bob{animation:bob 2.8s ease-in-out infinite}
.rolo{position:relative; border-radius:22px; overflow:hidden; background:linear-gradient(180deg,#CFCBEA 0%,#fff 30%,#fff 70%,#CFCBEA 100%); box-shadow:inset 0 0 0 5px #881337,inset 0 10px 20px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center}
.degrau{animation:sobeDegrau .5s cubic-bezier(.3,1.4,.5,1) both; transform-origin:50% 100%}
.cai{animation:cai linear infinite}

@keyframes anel{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.5; transform:scale(1.07)}}
@keyframes pulsa{50%{transform:scale(1.06)}}
@keyframes pulo{0%{transform:translateY(0)}45%{transform:translateY(-46px)}100%{transform:translateY(0)}}
@keyframes entra{from{opacity:0; transform:translateY(18px)}}
@keyframes fade{from{opacity:0}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes mola{0%{opacity:0; transform:scale(.7)}70%{opacity:1; transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes pop{0%{opacity:0; transform:scale(.6)}60%{opacity:1; transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes selo{0%{opacity:0; transform:translateY(-60px) rotate(-40deg)}100%{opacity:1; transform:rotate(3deg)}}
@keyframes vira{from{transform:perspective(900px) rotateX(85deg); opacity:.2}}
@keyframes pisca{50%{opacity:.45}}
@keyframes balanca{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes treme{0%,100%{transform:translateX(0)}17%,50%,83%{transform:translateX(-22px)}33%,67%{transform:translateX(22px)}}
@keyframes acende{from{opacity:0; transform:scale(.3)}}
@keyframes placa{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(-1.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes sobeDegrau{from{transform:scaleY(0)}}
@keyframes cai{from{transform:translateY(-140px) rotate(0)}to{transform:translateY(1240px) rotate(540deg)}}
@keyframes ampulheta{0%{transform:translateY(-320px) rotate(-60deg)}55%{transform:translateY(0) rotate(-14deg)}72%{transform:translateY(-36px) rotate(-12deg)}100%{transform:translateY(0) rotate(-14deg)}}
@keyframes coroa{0%{opacity:0; transform:translateY(-220px) rotate(-30deg)}70%{opacity:1; transform:translateY(8px) rotate(-6deg)}100%{transform:rotate(-8deg)}}
@keyframes some{0%{opacity:0; transform:scale(.6) rotate(-5deg)}12%{opacity:1; transform:scale(1.06) rotate(-5deg)}20%{transform:scale(1) rotate(-5deg)}80%{opacity:1}100%{opacity:0}}
@keyframes estoura{from{transform:translate(0,0) rotate(0); opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0}}
@keyframes brilha{50%{transform:scale(1.25); opacity:.55}}
@keyframes rodaRolo{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
/* ===== Casas especiais animadas (design "Casas Animadas"). A classe .ca vai no rosto da casa (.casa-f).
   Ciclos 1.2–3.6 s; estrobo ≤ 3 flashes/s. Regra de desempenho: só transform e opacity nos keyframes, sem var()
   dentro deles (halos = brilho pintado num ::before que só muda de opacidade; reflexos = faixa que desliza dentro
   de .ca__v). Assim tudo roda no compositor e o tabuleiro parado não custa nada à página. ===== */
:root{--ease-pop:cubic-bezier(.34,1.56,.64,1); --ease-snap:cubic-bezier(.7,0,.3,1)}
.casa-f.ca{overflow:visible; isolation:isolate}
.ca::before,.ca::after{content:""; position:absolute; pointer-events:none}
.ca .ca__i{position:relative; z-index:2; overflow:visible}
.ca__p{position:absolute; pointer-events:none; z-index:3}
.ca__v{position:absolute; inset:0; border-radius:inherit; overflow:hidden; pointer-events:none; z-index:3}
.ca__v b{position:absolute; left:0; top:0; bottom:0; width:60%; background:linear-gradient(105deg, transparent 15%, rgba(255,255,255,.75) 50%, transparent 85%); transform:translateX(-100%)}
@keyframes ca-reflexo{0%{transform:translateX(-100%)}100%{transform:translateX(170%)}}
@keyframes ca-halo{0%,100%{opacity:.3}50%{opacity:1}}
/* no duelo o tabuleiro fica desfocado e parado: sem animação nenhuma lá dentro (nem pausada) */
#l-tab.desfocado *,#l-tab.desfocado *::before,#l-tab.desfocado *::after{animation:none!important}
#palco.parado #tela *,#palco.parado #tela *::before,#palco.parado #tela *::after,
#palco.parado #fx *,#palco.parado #fx *::before,#palco.parado #fx *::after{animation-play-state:paused!important}

/* 1. Livre: dado quica, halo dourado */
.ca--livre::before{inset:0; border-radius:50%; z-index:-1; box-shadow:0 0 calc(var(--s)*.5) rgba(253,224,71,.95); animation:ca-halo 1.6s ease-in-out infinite}
.ca--livre .ca__i{animation:livre-dado 1.6s ease-in-out infinite}
@keyframes livre-dado{0%,100%{transform:scale(1) rotate(-6deg)}25%{transform:scale(1.1) rotate(4deg) translateY(-6%)}50%{transform:scale(1.02) rotate(6deg)}75%{transform:scale(1.08) rotate(-3deg) translateY(-3%)}}

/* 2. Atalho: seta dispara com rastro */
.casa-f.ca--atalho{overflow:hidden}
.ca--atalho .ca__i{animation:atalho-dash 1.2s var(--ease-snap) infinite}
.ca--atalho .ca__i::after{content:attr(data-icone); position:absolute; left:-38%; top:0; opacity:.35; animation:atalho-rastro 1.2s var(--ease-snap) infinite}
@keyframes atalho-dash{0%{transform:translateX(-70%); opacity:0}20%{transform:translateX(-8%); opacity:1}60%{transform:translateX(4%); opacity:1}85%,100%{transform:translateX(80%); opacity:0}}
@keyframes atalho-rastro{0%,50%{opacity:0}65%{opacity:.4}85%,100%{opacity:0}}

/* 3. Escorregão: parado, depois rajada de tremor e anel de alerta */
.ca--escorregao{animation:escorregao-tremor 2.4s linear infinite}
.ca--escorregao .ca__i{animation:escorregao-recuo 2.4s var(--ease-snap) infinite}
.ca--escorregao::after{inset:calc(var(--s)*-.14); border-radius:50%; border:calc(var(--s)*.05) solid #EF4444; opacity:0; animation:escorregao-alerta 2.4s steps(1) infinite}
@keyframes escorregao-tremor{0%,64%,100%{transform:translateX(0) rotate(0)}67%{transform:translateX(-7%) rotate(-4deg)}70%{transform:translateX(6%) rotate(3deg)}73%{transform:translateX(-5%) rotate(-3deg)}76%{transform:translateX(4%) rotate(2deg)}79%{transform:translateX(-2%) rotate(-1deg)}82%{transform:translateX(0)}}
@keyframes escorregao-recuo{0%,64%{transform:translateX(0)}70%{transform:translateX(-22%)}90%,100%{transform:translateX(0)}}
@keyframes escorregao-alerta{0%,64%{opacity:0}66%{opacity:1}74%{opacity:0}78%{opacity:.8}84%,100%{opacity:0}}

/* 4. Escudo: onda de choque + reflexo de vidro */
.ca--escudo::before{inset:0; border-radius:50%; z-index:-1; border:calc(var(--s)*.04) solid #7DD3FC; background:radial-gradient(circle, rgba(186,230,253,0) 55%, rgba(186,230,253,.45) 100%); animation:escudo-onda 2.2s cubic-bezier(.2,.6,.3,1) infinite}
.ca--escudo .ca__v b{animation:escudo-vidro 3.3s ease-in-out infinite}
.ca--escudo .ca__i{animation:escudo-firme 2.2s ease-out infinite}
@keyframes escudo-onda{0%{transform:scale(1); opacity:.9}100%{transform:scale(1.75); opacity:0}}
@keyframes escudo-vidro{0%,40%{transform:translateX(-100%)}75%,100%{transform:translateX(170%)}}
@keyframes escudo-firme{0%,100%{transform:scale(1)}8%{transform:scale(1.1)}22%{transform:scale(1)}}

/* 5. Todos contra todos: dois flashes por ciclo + faíscas radiais.
   Nada de var() dentro dos keyframes: assim o navegador anima no compositor, sem recalcular estilo a cada quadro. */
.ca--todos::before{inset:0; border-radius:50%; z-index:1; background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,.12) 70%); box-shadow:0 0 calc(var(--s)*.6) #FDE047; opacity:0; animation:todos-flash 1.2s steps(1) infinite}
.ca--todos .ca__i{animation:todos-raio 1.2s steps(1) infinite}
.ca--todos .ca__p{left:50%; top:50%; width:calc(var(--s)*.09); height:calc(var(--s)*.26); margin:calc(var(--s)*-.13) 0 0 calc(var(--s)*-.045); transform:rotate(calc(var(--i)*60deg))}
.ca--todos .ca__p b{position:absolute; inset:0; background:linear-gradient(#fff,#FDE047); border-radius:99px; box-shadow:0 0 10px #FDE047; opacity:0; transform:translateY(-192%) scaleY(0); animation:todos-faisca 1.2s ease-out infinite; animation-delay:calc(var(--i)*-.07s)}
@keyframes todos-flash{0%{opacity:1}8%{opacity:0}16%{opacity:.75}24%,100%{opacity:0}}
@keyframes todos-raio{0%{transform:scale(1.18) rotate(-8deg)}8%{transform:scale(1) rotate(0)}16%{transform:scale(1.12) rotate(6deg)}24%,100%{transform:scale(1) rotate(0)}}
@keyframes todos-faisca{0%{transform:translateY(-192%) scaleY(0); opacity:0}6%{transform:translateY(-238%) scaleY(1); opacity:1}28%{transform:translateY(-327%) scaleY(.2); opacity:0}100%{transform:translateY(-327%) scaleY(.2); opacity:0}}

/* 6. Congelado: respiração lenta, geada girando, cristais subindo */
/* (a "respiração" de escala do design saiu: escala no rosto + geada girando no ::after tirava a animação do compositor) */
.ca--congelado::before{inset:0; border-radius:50%; z-index:-1; box-shadow:0 0 calc(var(--s)*.4) rgba(165,243,252,.9); animation:ca-halo 3.6s ease-in-out infinite}
.ca--congelado::after{inset:0; border-radius:50%; z-index:1; background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.7), transparent 40%), conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0) 30%); mix-blend-mode:screen; animation:gira 7.2s linear infinite}
.ca--congelado .ca__i{animation:gira 10.8s linear infinite}
.ca--congelado .ca__p{width:calc(var(--s)*.1); height:calc(var(--s)*.1); left:calc(15% + var(--i)*17%); top:70%; background:linear-gradient(#fff,#fff) center/26% 100% no-repeat, linear-gradient(#fff,#fff) center/100% 26% no-repeat; border-radius:30%; filter:drop-shadow(0 0 4px #A5F3FC); opacity:0; animation:congelado-cristal 3.6s ease-in-out infinite; animation-delay:calc(var(--i)*-.72s)}
@keyframes congelado-cristal{0%{transform:translateY(0) scale(.3) rotate(0); opacity:0}30%{opacity:1}70%{opacity:.9}100%{transform:translateY(-900%) scale(1) rotate(90deg); opacity:0}}

/* 7. Troca: gira 180° e segura, com glitch ciano/rosa */
.ca--troca .ca__i{animation:troca-gira 2.8s var(--ease-snap) infinite}
.ca--troca .ca__i::before,.ca--troca .ca__i::after{content:attr(data-icone); position:absolute; inset:0; opacity:0; mix-blend-mode:screen}
.ca--troca .ca__i::before{color:#22D3EE; clip-path:inset(0 0 50% 0); animation:troca-glitch-a 2.8s steps(1) infinite}
.ca--troca .ca__i::after{color:#F472B6; clip-path:inset(50% 0 0 0); animation:troca-glitch-b 2.8s steps(1) infinite}
@keyframes troca-gira{0%,30%{transform:rotate(0)}45%,80%{transform:rotate(180deg)}95%,100%{transform:rotate(360deg)}}
@keyframes troca-glitch-a{0%,30%,48%,80%,98%,100%{opacity:0; transform:none}33%{opacity:.9; transform:translate(-9%,3%)}39%{opacity:.9; transform:translate(7%,-2%)}83%{opacity:.9; transform:translate(8%,2%)}90%{opacity:.9; transform:translate(-6%,-3%)}}
@keyframes troca-glitch-b{0%,30%,48%,80%,98%,100%{opacity:0; transform:none}35%{opacity:.9; transform:translate(9%,-3%)}42%{opacity:.9; transform:translate(-7%,2%)}86%{opacity:.9; transform:translate(-8%,2%)}93%{opacity:.9; transform:translate(6%,-2%)}}

/* 8. Checkpoint: bandeira ao vento + brilho de "salvo" */
.casa-f.ca--checkpoint{overflow:hidden}
.ca--checkpoint .ca__i{transform-origin:22% 92%; animation:checkpoint-vento 2.4s ease-in-out infinite}
.ca--checkpoint .ca__v b{opacity:.8; animation:checkpoint-salvo 3.6s ease-in-out infinite}
@keyframes checkpoint-vento{0%,100%{transform:rotate(-5deg) skewY(0)}25%{transform:rotate(3deg) skewY(-5deg) scaleX(.96)}50%{transform:rotate(6deg) skewY(2deg)}75%{transform:rotate(-2deg) skewY(5deg) scaleX(1.03)}}
@keyframes checkpoint-salvo{0%,55%{transform:translateX(-100%)}85%,100%{transform:translateX(170%)}}

/* 9. Chegada: aura dourada, reflexo cruzando, troféu pulsa, 8 partículas em órbita */
.ca--chegada::before{inset:0; border-radius:inherit; z-index:-1; box-shadow:0 0 calc(var(--s)*.75) rgba(253,224,71,1), 0 0 calc(var(--s)*1.2) rgba(244,114,182,.45); animation:ca-halo 2.6s ease-in-out infinite}
.ca--chegada .ca__v{z-index:1}
.ca--chegada .ca__v b{background:linear-gradient(110deg, transparent 15%, rgba(255,251,235,.95) 50%, transparent 85%); animation:chegada-shimmer 2.6s cubic-bezier(.45,0,.2,1) infinite}
.ca--chegada .ca-trofeu{position:relative; z-index:2; animation:chegada-trofeu 2.6s var(--ease-pop) infinite}
.ca--chegada .ca__p{left:50%; top:50%; width:calc(var(--s)*.11); height:calc(var(--s)*.11); margin:calc(var(--s)*-.055); animation:chegada-orbita 6.5s linear infinite; animation-delay:calc(var(--i)*-.8125s)}
.ca--chegada .ca__p b{position:absolute; inset:0; border-radius:50%; background:hsl(calc(var(--i)*45 + 20) 95% 62%); box-shadow:0 0 8px #FDE047; animation:chegada-brilho 1.3s ease-in-out infinite; animation-delay:calc(var(--i)*-.18s)}
.ca--chegada .ca__p:nth-of-type(odd) b{background:#FDE047}
@keyframes chegada-shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(170%)}}
@keyframes chegada-trofeu{0%,55%,100%{transform:scale(1)}65%{transform:scale(1.14) rotate(-6deg)}78%{transform:scale(1) rotate(0)}}
@keyframes chegada-orbita{from{transform:rotate(0deg) translateX(818%) rotate(0deg)}to{transform:rotate(360deg) translateX(818%) rotate(-360deg)}}
@keyframes chegada-brilho{0%,100%{opacity:.35; transform:scale(.6)}50%{opacity:1; transform:scale(1.15)}}

/* ===== Pouso: impacto (260 ms) → reação do peão por tipo de casa (900 ms) ===== */
.pc .peao{transform-origin:50% 100%}
.peao.is-impacto{animation:peao-squash .26s var(--ease-pop) both}
@keyframes peao-squash{0%{transform:scale(1.25,.72)}55%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
.casa-f.is-pouso{animation:casa-afunda .32s var(--ease-pop) both!important}
@keyframes casa-afunda{0%{transform:translateY(0) scale(1)}35%{transform:translateY(6%) scale(1.08,.9)}100%{transform:none}}
.anel-impacto{position:absolute; inset:0; pointer-events:none; z-index:4; border:calc(var(--s,96px)*.07) solid var(--c,#fff); animation:anel-impacto .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes anel-impacto{0%{transform:scale(.9); opacity:1}100%{transform:scale(2.1); opacity:0; border-width:2px}}
.peao.fx-livre{animation:fx-livre .9s var(--ease-pop) both}
.peao.fx-atalho{animation:fx-atalho .9s var(--ease-snap) both}
.peao.fx-escorregao{animation:fx-escorregao .9s linear both}
.peao.fx-escudo{animation:fx-escudo .9s ease-out both}
.peao.fx-todos{animation:fx-todos .9s steps(1) both}
.peao.fx-congelado{animation:fx-congelado .9s ease-out both}
.peao.fx-troca{animation:fx-troca .9s var(--ease-snap) both}
.peao.fx-checkpoint{animation:fx-checkpoint .9s var(--ease-pop) both}
.peao.fx-chegada{animation:fx-chegada .9s var(--ease-pop) both}
@keyframes fx-livre{0%{transform:none}30%{transform:translateY(-45%) rotate(-8deg)}55%{transform:none}75%{transform:translateY(-20%) rotate(6deg)}100%{transform:none; filter:drop-shadow(0 0 18px #FDE047)}}
/* --dir: +1/−1 = para que lado da tela fica o caminho (o tabuleiro é em zigue-zague) */
@keyframes fx-atalho{0%{transform:none}25%{transform:translateX(calc(-12% * var(--dir,1))) scale(1.08,.92)}100%{transform:translateX(calc(140% * var(--dir,1))) skewX(calc(-12deg * var(--dir,1))); opacity:0}}
@keyframes fx-escorregao{0%{transform:none}8%{transform:translateX(-6%) rotate(-6deg)}16%{transform:translateX(6%) rotate(6deg)}24%{transform:translateX(-5%) rotate(-5deg)}32%{transform:translateX(4%) rotate(4deg)}45%{transform:rotate(calc(14deg * var(--dir,-1))); filter:drop-shadow(0 0 14px #EF4444)}100%{transform:translateX(calc(150% * var(--dir,-1))) rotate(calc(24deg * var(--dir,-1))); opacity:0}}
@keyframes fx-escudo{0%{filter:none}30%{filter:drop-shadow(0 0 22px #38BDF8) brightness(1.2)}100%{filter:drop-shadow(0 0 10px #38BDF8)}}
@keyframes fx-todos{0%{transform:translate(-3%,0); filter:brightness(1.6)}12%{transform:translate(3%,-2%); filter:none}24%{transform:translate(-2%,1%); filter:brightness(1.5)}36%{transform:none; filter:none}48%{filter:brightness(1.4)}60%,100%{transform:none; filter:drop-shadow(0 0 14px #FACC15)}}
@keyframes fx-congelado{0%{filter:none}100%{filter:saturate(.25) brightness(1.15) hue-rotate(160deg) drop-shadow(0 0 12px #A5F3FC)}}
@keyframes fx-troca{0%{transform:none}50%{transform:rotateY(540deg) scale(.7); opacity:.4}100%{transform:rotateY(720deg); opacity:1; filter:drop-shadow(0 0 14px #A855F7)}}
@keyframes fx-checkpoint{0%{transform:none}35%{transform:translateY(-25%) scale(1.08)}100%{transform:none; filter:drop-shadow(0 0 16px #F97316)}}
@keyframes fx-chegada{0%{transform:none}25%{transform:translateY(-60%) rotate(-10deg) scale(1.15)}50%{transform:translateY(-60%) rotate(10deg) scale(1.15)}100%{transform:none; filter:drop-shadow(0 0 22px #FDE047)}}
/* bolha de escudo e bloco de gelo: ficam sobre o peão enquanto durar o estado */
.bolha-escudo{position:absolute; left:50%; bottom:-6%; width:140%; aspect-ratio:1; translate:-50% 0; border-radius:50%; z-index:6; pointer-events:none; box-sizing:border-box; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.65), rgba(186,230,253,.18) 45%, rgba(56,189,248,.35) 100%); border:4px solid rgba(186,230,253,.9); animation:bolha .6s var(--ease-pop) both, bolha-respira 2.2s ease-in-out .6s infinite}
@keyframes bolha{from{transform:scale(0); opacity:0}to{transform:scale(1); opacity:1}}
@keyframes bolha-respira{50%{transform:scale(1.05)}}
.bloco-gelo{position:absolute; left:50%; bottom:-3%; width:118%; height:106%; translate:-50% 0; z-index:6; pointer-events:none; box-sizing:border-box; border-radius:22%; background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(165,243,252,.25) 40%, rgba(34,211,238,.35)); border:3px solid rgba(255,255,255,.8); box-shadow:inset 0 0 20px rgba(255,255,255,.6); animation:gelo .5s cubic-bezier(.2,.9,.3,1.2) .35s both}
@keyframes gelo{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
/* ===== Tela de vitória (design "Vitória Animada"). Sequência em ms:
   0 tabuleiro escurece · 200 holofotes · 300 confete ∞ · 400 fogos ∞ · 900 pódio sobe · 1300 peão salta
   2000 impacto (flash, tremor, anel, explosão, aura) · 2200 título · 2600 nome · 3000 placar · 4000 botões ===== */
.vit{position:absolute; inset:0; overflow:hidden; color:#fff; background:linear-gradient(160deg,#1E1B4B 0%,#312E81 100%)}
.vit *{box-sizing:border-box}
.vit .camera{position:absolute; inset:0; animation:camera 320ms linear 2000ms both}
@keyframes camera{0%,100%{transform:none}20%{transform:translate(-8px,6px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}

@keyframes mesa-dim{from{opacity:1; filter:blur(0) saturate(1)}to{opacity:.22; filter:blur(6px) saturate(.6)}}

@keyframes holofote-liga{from{opacity:0}to{opacity:.55}}

.vit .cf{position:absolute; top:-60px; left:var(--x); width:var(--w); height:var(--h); border-radius:var(--r); background:var(--c); opacity:0; animation:cf-cai var(--dur) linear calc(300ms + var(--del)) infinite}
@keyframes cf-cai{0%{opacity:1; transform:translate(0,0) rotate(0) rotateY(0)}25%{transform:translate(var(--sway),300px) rotate(calc(var(--rot)*.25)) rotateY(180deg)}50%{transform:translate(0,600px) rotate(calc(var(--rot)*.5)) rotateY(360deg)}75%{transform:translate(calc(var(--sway)*-1),900px) rotate(calc(var(--rot)*.75)) rotateY(540deg)}100%{opacity:1; transform:translate(0,1200px) rotate(var(--rot)) rotateY(720deg)}}
.vit .fw{position:absolute; width:0; height:0}
.vit .fw-raio{position:absolute; left:-4px; top:0; width:8px; height:70px; border-radius:99px; transform-origin:50% 0; background:linear-gradient(to bottom, transparent, var(--c) 40%, #fff); opacity:0; animation:fw-raio 2.4s cubic-bezier(.15,.8,.3,1) calc(400ms + var(--del)) infinite}
@keyframes fw-raio{0%{opacity:0; transform:rotate(var(--a)) translateY(0) scaleY(.2)}4%{opacity:1}30%{opacity:1; transform:rotate(var(--a)) translateY(130px) scaleY(1)}50%,100%{opacity:0; transform:rotate(var(--a)) translateY(190px) scaleY(.3)}}
.vit .fw-nucleo{position:absolute; width:60px; height:60px; margin:-30px; border-radius:50%; background:radial-gradient(circle, #fff, var(--c) 45%, transparent 70%); opacity:0; animation:fw-nucleo 2.4s ease-out calc(400ms + var(--del)) infinite}
@keyframes fw-nucleo{0%{opacity:1; transform:scale(.2)}18%{opacity:.9; transform:scale(1.6)}40%,100%{opacity:0; transform:scale(2)}}
.vit .podio-bloco{position:absolute; bottom:0; display:flex; justify-content:center; animation:podio-sobe 600ms cubic-bezier(.34,1.56,.64,1) var(--del) both}
@keyframes podio-sobe{from{transform:translateY(105%)}to{transform:translateY(0)}}
.vit .peao-vencedor{position:absolute; transform-origin:50% 100%; animation:peao-vence 1000ms cubic-bezier(.3,0,.4,1) 1300ms both}
@keyframes peao-vence{0%{opacity:0; transform:translate(-520px,420px) rotate(-20deg) scale(.8)}6%{opacity:1}38%{transform:translate(-220px,-300px) rotate(-10deg) scale(1.05,1.08)}70%{transform:translate(0,0) rotate(0) scale(1.32,.68)}80%{transform:translate(0,-40px) scale(.88,1.15)}90%{transform:translate(0,0) scale(1.06,.95)}100%{opacity:1; transform:none}}
.vit .peoes-coadj{position:absolute; transform-origin:50% 100%; animation:coadj 500ms cubic-bezier(.34,1.56,.64,1) var(--del) both}
@keyframes coadj{from{opacity:0; transform:translateY(-120px) scale(.9)}to{opacity:1; transform:none}}
.vit .aura{position:absolute; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(253,224,71,.95) 0%, rgba(250,204,21,.45) 32%, transparent 66%); animation:aura-acende 400ms cubic-bezier(.34,1.56,.64,1) 2000ms both, aura-pulsa 1.8s ease-in-out 2400ms infinite}

@keyframes aura-acende{from{opacity:0; transform:scale(.2)}to{opacity:1; transform:scale(1)}}
@keyframes aura-pulsa{0%,100%{transform:scale(1); opacity:1}50%{transform:scale(1.1); opacity:.8}}
.vit .anel-podio{position:absolute; border-radius:50%; border:14px solid #FDE047; opacity:0; animation:anel-podio 700ms cubic-bezier(.2,.7,.3,1) 2000ms both}
@keyframes anel-podio{0%{opacity:1; transform:scale(.3)}100%{opacity:0; transform:scale(2.4); border-width:2px}}
.vit .flash{position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 25% 70%, #FFF7D6, rgba(255,255,255,0) 60%); opacity:0; animation:flash 450ms ease-out 2000ms both}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.vit .titulo{display:grid; justify-items:center; animation:titulo-bate 650ms cubic-bezier(.2,1.4,.4,1) 2200ms both}

/* =============================== TABULEIRO: GERAÇÃO =============================== */
/* Distribuição das casas por trilha. A trilha se divide em 3 trechos pelos checkpoints (34% e 69%):
   - Início: mais ajuda (atalho, escudo, casa livre) para todo mundo sair do lugar.
   - Meio: equilibrado, bom e ruim alternados.
   - Final: quase nada que empurre para a frente. Só tensão (escorregão, congelado) e casas de recuperação
     (Troca e Todos contra todos), que ajudam quem está atrás e mantêm a disputa aberta até a chegada.
   Dentro de cada trecho, as casas são espalhadas por igual e alternam o bom e o ruim. */
const PLANO_TABULEIRO = {
  24: [['livre','atalho','escorregao','escudo'], ['atalho','escorregao','todos','congelado','livre'], ['troca','escorregao','todos']],
  32: [['livre','atalho','escorregao','escudo','livre'], ['atalho','escorregao','todos','congelado','escudo','livre'], ['escorregao','troca','congelado','todos']],
  48: [['livre','atalho','escorregao','escudo','todos','atalho','livre'], ['atalho','escorregao','livre','congelado','escudo','todos','escorregao','troca'], ['escorregao','troca','congelado','todos','escorregao']],
};
const BOAS = new Set(['livre','atalho','escudo']), RUINS = new Set(['escorregao','congelado']);
function gerarTabuleiro(N, seed){
  const cps = [Math.round(N*.34), Math.round(N*.69)];
  const plano = PLANO_TABULEIRO[N] || PLANO_TABULEIRO[32];
  const trechos = [[2, cps[0] - 1], [cps[0] + 1, cps[1] - 1], [cps[1] + 1, N - 1]];
  const MOV = ['atalho','escorregao','troca'];
  for(let t = 0; t < 400; t++){
    const rnd = mulberry32(seed + t*7919), jit = t < 300 ? 1 : 0;
    const casas = Array.from({length:N+1}, (_,i) => ({i, tipo:'normal', cat:null, efeito:null, checkpoint:false}));
    casas[0].tipo = 'largada'; casas[N].tipo = 'chegada';
    cps.forEach(i => { casas[i].checkpoint = true; casas[i].cat = 'livre'; });
    let ok = true;
    plano.forEach((lista, z) => {
      if(!ok) return;
      /* alterna bom/ruim: no início começa por uma boa, no final por uma ruim */
      const boas = embaralhar(lista.filter(e => BOAS.has(e)), rnd), ruins = embaralhar(lista.filter(e => RUINS.has(e)), rnd), neutras = embaralhar(lista.filter(e => !BOAS.has(e) && !RUINS.has(e)), rnd);
      const ordem = [], fila = z === 2 ? [ruins, neutras, boas] : [boas, ruins, neutras];
      while(ordem.length < lista.length){ for(const f of fila) if(f.length) ordem.push(f.shift()); }
      const [ini, fim] = trechos[z], m = fim - ini + 1, k = ordem.length;
      ordem.forEach((ef, j) => {
        if(!ok) return;
        const ideal = Math.round(ini + (j + .5)*m/k - .5);
        const tentativas = [0, -1, 1, -2, 2].map(d => ideal + d + (jit ? Math.floor(rnd()*3) - 1 : 0));
        const i = tentativas.find(i => {
          if(i < ini || i > fim) return false;
          const c = casas[i]; if(c.cat || c.efeito || c.checkpoint) return false;
          const viz = [casas[i-1], casas[i+1]].filter(Boolean);
          if(ef === 'livre' ? viz.some(o => o.cat === 'livre') : viz.some(o => o.efeito)) return false;
          if(ef === 'atalho' && i > N - 4) return false;
          if(ef === 'troca' && i <= N/2) return false;
          if(MOV.includes(ef) && casas.some(o => o.efeito && MOV.includes(o.efeito) && Math.abs(o.i - i) < 3)) return false;
          return true;
        });
        if(i == null){ ok = false; return; }
        if(ef === 'livre') casas[i].cat = 'livre'; else casas[i].efeito = ef;
      });
    });
    if(!ok) continue;
    const vazias = casas.filter(c => c.tipo === 'normal' && !c.cat && !c.efeito);
    let pool = []; while(pool.length < vazias.length) pool = pool.concat(embaralhar(CAT_IDS, rnd));
    vazias.forEach((c,k) => c.cat = pool[k]);
    for(let k=1;k<vazias.length;k++) if(vazias[k].cat === vazias[k-1].cat){
      const m = vazias.findIndex((c,x) => x > k+1 && c.cat !== vazias[k].cat && c.cat !== vazias[k-1].cat);
      if(m > -1){ const tmp = vazias[k].cat; vazias[k].cat = vazias[m].cat; vazias[m].cat = tmp; }
    }
    return {casas, checkpoints:cps};
  }
  throw new Error('Não foi possível gerar o tabuleiro');
}
function tipoCasa(i){
  const c = S.casas[i]; if(!c) return 'N';
  if(c.tipo !== 'normal') return c.tipo;
  if(c.checkpoint) return 'checkpoint';
  if(c.efeito) return c.efeito;
  return c.cat === 'livre' ? 'livre' : c.cat;
}
function descCasa(i){
  const c = S.casas[i], t = tipoCasa(i);
  if(t === 'largada') return 'Largada · você escolhe a categoria';
  if(t === 'livre') return `Casa ${i} · Livre: você escolhe`;
  if(t === 'checkpoint') return `Casa ${i} · Checkpoint: você escolhe`;
  if(c.efeito) return `Casa ${i} · categoria sorteada`;
  return `Casa ${i} · ${CATS[c.cat].nome}`;
}

const ROWS = [620,446,272,98], XA = 163, XB = 997, RAIO = 87, LIN = XB-XA, ARCO = Math.PI*RAIO, TOTAL = 4*LIN + 3*ARCO;
/* Para que lado da tela o caminho segue a partir da casa i (passo +1 = em frente, −1 = para trás).
   O tabuleiro é em zigue-zague: nas fileiras pares o "em frente" é para a esquerda. Nas curvas, olha 2 casas adiante. */
function sentido(i, passo){
  for(const k of [1, 2]){ const dx = pos(Math.max(0, Math.min(S.N, i + passo*k))).x - pos(i).x; if(Math.abs(dx) > 20) return Math.sign(dx); }
  return passo;
}
/* Os ícones ⏩ (atalho) e ⏪ (escorregão) apontam para a direita/esquerda; espelha quando o caminho vai ao contrário. */
function espelhaCasa(tipo, i){ return i == null ? false : tipo === 'atalho' ? sentido(i, 1) < 0 : tipo === 'escorregao' ? sentido(i, -1) > 0 : false; }
function pos(i){
  let d = i*TOTAL/S.N;
  for(let k=0;k<4;k++){
    const ltr = k % 2 === 0;
    if(d <= LIN + .01 || k === 3) return {x: ltr ? XA+d : XB-d, y: ROWS[k]};
    d -= LIN;
    if(d <= ARCO){ const t = d/RAIO, cy = (ROWS[k]+ROWS[k+1])/2, cx = ltr ? XB : XA; return {x: cx + (ltr ? 1 : -1)*RAIO*Math.sin(t), y: cy + RAIO*Math.cos(t)}; }
    d -= ARCO;
  }
}

function outrosAtivos(eu){ return S.jogadores.filter(j => j.ativo && j.id !== eu.id).map(j => j.id); }
function pendentesAtuais(eu, outros){ const p = eu.rotacao.pendentes.filter(id => outros.includes(id)); return p.length ? p : [...outros]; }
function oponentesValidos(eu){
  const outros = outrosAtivos(eu);
  if(outros.length <= 1) return outros;
  const pend = pendentesAtuais(eu, outros);
  return pend.length === outros.length ? pend.filter(id => id !== eu.rotacao.ultimoDesafiado) : pend;
}
function registrarDesafio(eu, alvo){ const pend = pendentesAtuais(eu, outrosAtivos(eu)); eu.rotacao.pendentes = pend.filter(id => id !== alvo); eu.rotacao.ultimoDesafiado = alvo; }
function cicloInfo(eu){ const outros = outrosAtivos(eu); const p = eu.rotacao.pendentes.filter(id => outros.includes(id)); return {feitos: p.length ? outros.length - p.length : 0, total: outros.length}; }
const listaOponentes = j => S.ordem.filter(id => id !== j.id).map(jog).filter(x => x.ativo);

/* =============================== PERGUNTAS =============================== */
let IDX = null;
function indiceBanco(){
  if(IDX && IDX.banco === S.banco) return IDX;
  IDX = {banco:S.banco, grupo:new Map(), porCat:new Map()};
  for(const q of S.banco){
    const g = q.categoria + q.dificuldade; (IDX.grupo.get(g) || IDX.grupo.set(g, []).get(g)).push(q);
    (IDX.porCat.get(q.categoria) || IDX.porCat.set(q.categoria, new Set()).get(q.categoria)).add(q.id);
  }
  return IDX;
}
function usadasSet(){ if(!T.us || T.us.arr !== S.usadas){ T.us = {arr:S.usadas, set:new Set(S.usadas)}; } return T.us.set; }
/* Histórico entre partidas: cada pergunta guarda a ordem em que foi vista pela última vez neste navegador.
   O sorteio prefere perguntas nunca vistas; se todas já saíram, sorteia entre o quarto mais antigo. */
const K_HIST = 'osvaldoland-vistas';
let HIST = null;
function historico(){ if(!HIST){ const h = ler(K_HIST, null); HIST = h && h.v ? h : {seq:0, v:{}}; } return HIST; }
function escolherMenosVista(lista){
  const h = historico().v, nunca = lista.filter(q => !(q.id in h));
  if(nunca.length) return nunca[Math.floor(Math.random()*nunca.length)];
  const ord = lista.slice().sort((a,b) => h[a.id] - h[b.id]), k = Math.max(1, Math.ceil(ord.length/4));
  return ord[Math.floor(Math.random()*k)];
}
function marcarVista(id){
  const H = historico(); H.v[id] = ++H.seq;
  const ids = Object.keys(H.v);
  if(ids.length > 3000) ids.sort((a,b) => H.v[a] - H.v[b]).slice(0, ids.length - 2000).forEach(x => delete H.v[x]);
  gravar(K_HIST, H);
}
function usar(q){ S.usadas.push(q.id); usadasSet().add(q.id); if(q.id !== 'vazio') marcarVista(q.id); return q; }
function sortearPergunta(cat, dif){
  const ix = indiceBanco(), us = usadasSet(), pega = escolherMenosVista;
  const ordem = [dif, ...[1,2,3].filter(x => x !== dif).sort((a,b) => Math.abs(a-dif) - Math.abs(b-dif))];
  for(const df of ordem){
    const livres = (ix.grupo.get(cat + df) || []).filter(q => !us.has(q.id));
    if(livres.length) return usar(pega(livres));
  }
  const ids = ix.porCat.get(cat);
  if(!ids) return {id:'vazio', categoria:cat, dificuldade:dif, enunciado:'O banco não tem perguntas desta categoria. O juiz faz uma pergunta de cabeça!', resposta:'(definida pelo juiz)'};
  S.usadas = S.usadas.filter(id => !ids.has(id));
  const l = ix.grupo.get(cat + dif) || ordem.map(df => ix.grupo.get(cat + df)).find(x => x && x.length);
  return usar(pega(l));
}
function normalizarBanco(dados){
  const lista = Array.isArray(dados) ? dados : (dados && Array.isArray(dados.perguntas) ? dados.perguntas : null);
  if(!lista) throw new Error('O arquivo precisa ter uma lista de perguntas (ou um campo "perguntas" com a lista).');
  const mapa = {}; CAT_IDS.forEach(c => { mapa[c.toLowerCase()] = c; mapa[CATS[c].nome.toLowerCase()] = c; });
  mapa['★'] = 'S'; mapa['pop'] = 'S';
  const ok = []; let rej = 0;
  lista.forEach((q, i) => {
    const k = q && String(q.categoria ?? '').trim().toLowerCase();
    const cat = mapa[k], dif = Number(q && q.dificuldade);
    if(cat && [1,2,3].includes(dif) && q.enunciado && q.resposta) ok.push({id: String(q.id || 'i' + (i+1)), categoria:cat, dificuldade:dif, enunciado:String(q.enunciado), resposta:String(q.resposta)});
    else rej++;
  });
  if(!ok.length) throw new Error('Nenhuma pergunta válida. Confira categoria, dificuldade (1 a 3), enunciado e resposta.');
  return {ok, rej};
}

/* =============================== FLUXO DA PARTIDA =============================== */
function novaPartida(){

  const {casas, checkpoints} = gerarTabuleiro(N, seed);

function iniciarTurno(){

}
function proximoTurno(){

}
function irOponente(){

}
function escolherOponente(id){

  S.duelo = {tipo:'normal', desafiante:j.id, desafiado:id, elegiveis:[j.id, id], categoria:null, dificuldade:null, pergunta:null, respondeuId:null, restante:S.config.tempo*1000, ativo:false, emRebote:false, sorteada:false};

}
function escolherCategoria(c){ if(S.fase !== 'categoria' || !CATS[c]) return; S.duelo.categoria = c; S.fase = 'dificuldade'; render(); }
function confirmarCategoria(){ if(S.fase !== 'categoria_imposta') return; S.fase = 'dificuldade'; render(); }
function escolherDificuldade(d){
  if(S.fase !== 'dificuldade' || !DIFS[d]) return;

}
function lancarPergunta(mesma){

}
function marcar(id){

  d.respondeuId = id; d.ativo = false; S.fase = 'resposta'; render();
}
function voltarMarcacao(){

}
function revelar(){
  if(S.fase !== 'resposta') return;
  S.fase = 'validacao'; const {cad, banco, ...resto} = S; T.snapshot = {S:clone(resto), vis:clone(T.vis), resA:T.resA ? clone(T.resA) : null}; render();
}
async function validar(certo){
  if(S.fase !== 'validacao' || T.ocupado) return;
  const d = S.duelo, r = jog(d.respondeuId);
  som(certo ? 'acerto' : 'erro');
  if(!certo){
    /* Errou e ainda cabe rebote: a tela do duelo continua e o tabuleiro só volta no fim da rodada.
       A punição de quem errou fica guardada (T.resA) e é aplicada quando a rodada termina. */
    const elig = d.elegiveis.filter(x => x !== r.id);
    if(elig.length > 0 && d.restante > 1000 && (d.tipo === 'todos' || S.config.rebote)){
      r.st.erros++; r.st.seq = 0; d.elegiveis = elig; d.errouId = r.id;
      if(!T.resA) T.resA = {certo:false, id:r.id, de:r.posicao, ate:r.posicao, extras:[], resposta:d.pergunta.resposta, categoria:d.categoria, tipo:d.tipo, emRebote:d.emRebote, punir:d.tipo === 'normal' && !d.emRebote, dif:d.dificuldade};
      S.fase = 'erro_rebote'; render(); return;
    }
  }
  T.ocupado = true;
  T.res = {certo, id:r.id, de:r.posicao, ate:r.posicao, extras:[], resposta:d.pergunta.resposta, categoria:d.categoria, tipo:d.tipo, emRebote:d.emRebote};
  S.fase = 'movendo'; render();

    r.st.acertos++; r.st.seq++; r.st.maxSeq = Math.max(r.st.maxSeq, r.st.seq); r.st.porCat[d.categoria] = (r.st.porCat[d.categoria] || 0) + 1;
    let casas = d.tipo === 'todos' ? 1 : d.dificuldade;
    if(d.tipo === 'normal' && S.config.retaFinal && r.posicao >= S.N - 4 && d.dificuldade === 1){ casas = 0; T.res.extras.push('Reta final: pergunta fácil não faz andar.'); }
    if(casas && S.config.vento && ehUltimo(r)){ casas++; T.res.extras.push('Vento a favor: +1 casa para quem estava em último.'); }
    T.res.valor = casas;
    if(casas){ mostrarBig(`+${casas} ${plural(casas,'casa','casas')}!`, 'acerto'); await mover(r, casas); }
    if(S.vencedor){ T.ocupado = false; return; }
    if(d.tipo === 'normal'){

      if(r2 === 'todos'){ T.ocupado = false; return; }
    }

  } else {
    r.st.erros++; r.st.seq = 0;
    if(d.tipo === 'normal' && !d.emRebote) await aplicarPunicao(r, d.dificuldade);
    T.res.ate = r.posicao;
    d.elegiveis = d.elegiveis.filter(x => x !== r.id);
    T.ocupado = false; S.fase = 'resultado'; render();
  }
}
/* Aplica a punição guardada de quem errou antes do rebote e registra no resultado da rodada. */
async function aplicarPendente(){
  const a = T.resA; if(!a) return; T.resA = null;
  const j = jog(a.id), atualRes = T.res;
  if(a.punir){ T.res = a; await aplicarPunicao(j, a.dif); a.ate = j.posicao; T.res = atualRes; }
  const n = a.de - a.ate;
  atualRes.extras.unshift(n > 0 ? `${j.nome} errou antes e voltou ${n} ${plural(n, 'casa', 'casas')}.` : a.penal && a.punir ? `${j.nome} errou antes. ${a.penal}` : `${j.nome} errou antes.`);
}
/* Rebote: o outro jogador responde a MESMA pergunta (na conferência os jogadores não olham para a tela). */
function fazerRebote(){ if(S.fase !== 'erro_rebote') return; S.duelo.emRebote = true; T.res = null; T.mov = null; lancarPergunta(true); }
/* Rodada termina sem acerto no rebote (pulado, tempo esgotado ou "Ninguém sabe"): agora sim volta ao tabuleiro e aplica a punição guardada. */
async function encerrarRebote(motivo){
  const a = T.resA; if(!a || T.ocupado) return;
  T.resA = null; T.ocupado = true; T.auto = null; T.alerta = false;
  if(S.duelo) S.duelo.ativo = false;

}
function pularRebote(){ if(S.fase !== 'erro_rebote') return; encerrarRebote(''); }
function tempoEsgotado(){
  const d = S.duelo; d.ativo = false; T.alerta = false; T.desistiu = false; som('tempo');
  if(T.resA){ encerrarRebote('O tempo do rebote acabou.'); return; }

}
/* Ninguém sabe: pula o resto do tempo. Vale como tempo esgotado (ninguém anda, ninguém é punido). */
function desistir(){
  if(S.fase !== 'pergunta' || !S.duelo) return;
  if(T.resA){ S.duelo.ativo = false; encerrarRebote('Ninguém soube no rebote.'); return; }
  tempoEsgotado(); T.desistiu = true; render();
}
function ehUltimo(r){ const ps = ativos().map(j => j.posicao); const min = Math.min(...ps); return r.posicao === min && min < Math.max(...ps); }
function atualizarCheckpoint(j){ S.checkpoints.forEach(cp => { if(j.posicao >= cp) j.checkpoint = Math.max(j.checkpoint, cp); }); }
async function esperar(ms){
  let resta = ms;
  while(resta > 0){
    const t0 = performance.now();
    await sleep(Math.min(resta, 50));
    if(!T.pausado && !T.modal) resta -= performance.now() - t0;
  }
}
async function animar(id, de, ate){
  if(de === ate) return;
  const p = ate > de ? 1 : -1;
  for(let x = de; x !== ate; x += p){ T.vis[id] = x + p; T.pulando.add(id); renderTab(); pularPeca(id); await esperar(REDUZ ? 60 : 230); }
  T.pulando.delete(id); renderTab();
}
async function mover(j, delta){
  T.foco = j.id;

/* Pouso numa casa especial (design "Casas Animadas"): impacto (peão achata, casa afunda, anel) → reação do peão.

async function pouso(j, tipo, fx = tipo){
  const el = R.pecas[j.id], wrap = document.querySelector(`#tab-casas [data-i="${j.posicao}"]`);
  if(REDUZ || !el || !wrap) return;
  const p = el.firstElementChild, tile = wrap.querySelector('.casa-f'), d = TILES[tipo] || TILES.N;
  const dirF = j.posicao < S.N ? sentido(j.posicao, 1) : -sentido(j.posicao, -1), dirT = sentido(j.posicao, -1);
  p.style.setProperty('--dir', fx === 'escorregao' ? dirT : dirF);
  limparPouso(j);
  const anel = document.createElement('span'); anel.className = 'anel-impacto';
  anel.style.cssText = `--s:${tile.offsetWidth}px;--c:${d.cor};border-radius:${getComputedStyle(tile).borderRadius}`;
  wrap.firstElementChild.appendChild(anel);
  tile.classList.add('is-pouso'); p.classList.add('is-impacto');
  await esperar(260);
  p.classList.remove('is-impacto');
  if(fx){ p.classList.add('fx-' + fx); el.dataset.fx = fx; renderTab(); await esperar(900); }
  else await esperar(120);
  tile.classList.remove('is-pouso'); anel.remove();
}
function limparPouso(j){ const el = R.pecas[j.id]; if(el && el.dataset.fx){ el.firstElementChild.classList.remove('fx-' + el.dataset.fx); delete el.dataset.fx; } }
function usaEscudo(j, oque){ if(!j.escudo) return false; j.escudo = false; T.res && T.res.extras.push(`O escudo de ${j.nome} anulou ${oque}.`); return true; }
async function aplicarPunicao(r, dif){
  const p = S.config.punicao;

  if(usaEscudo(r, 'a punição')){ T.res.penal = 'O escudo anulou a punição.'; return; }
  if(p === 'perdeTurno'){ r.congelado = true; T.res.penal = `${r.nome} perde a próxima vez.`; return; }

async function efeitoCasa(r){
  const c = S.casas[r.posicao]; if(!c) return;

  const e = c.efeito, card = {tipo:e, j:r.id, casa:r.posicao, titulo:EFEITOS[e].nome + '!', texto:''};
  const mostrarEspecial = async cd => { await pouso(r, e, cd.fx === undefined ? e : cd.fx); await mostrarEspecialCard(cd); limparPouso(r); };
  const marcas = r.marcas = r.marcas || [], aqui = r.posicao, marcar = () => { if(!marcas.includes(aqui)) marcas.push(aqui); };
  if(marcas.includes(aqui)){
    card.texto = 'Você já usou esta casa: o efeito não vale de novo'; card.imune = true; card.fx = null;
    T.res.extras.push(`${EFEITOS[e].nome}: ${r.nome} já usou esta casa, nada acontece.`);
    await mostrarEspecial(card); return;
  }
  switch(e){
    case 'atalho': marcar(); card.texto = 'Avance 2 casas!'; await mostrarEspecial(card); { const a = await mover(r, 2); T.res.extras.push(`Atalho: +${a} ${plural(a,'casa','casas')}.`); } break;
    case 'escorregao':
      if(r.escudo){ usaEscudo(r, 'o escorregão'); card.texto = 'O escudo te protegeu!'; card.fx = 'escudo'; await mostrarEspecial(card); break; }
      marcar(); card.texto = 'Volte 2 casas'; await mostrarEspecial(card);
      { const a = await mover(r, -2); T.res.extras.push(a ? `Escorregão: voltou ${-a} ${plural(a,'casa','casas')}.` : 'Escorregão: protegido pelo checkpoint.'); } break;
    case 'escudo':

      else { marcar(); r.escudo = true; card.texto = 'Anula o próximo efeito negativo'; T.res.extras.push(`${r.nome} ganhou um escudo.`); }
      await mostrarEspecial(card); break;
    case 'congelado':

    case 'troca': {
      const alvo = ativos().filter(j => j.id !== r.id && j.posicao > r.posicao && j.posicao - r.posicao <= 5).sort((a,b) => a.posicao - b.posicao)[0];
      if(!alvo){ card.texto = 'Ninguém a até 5 casas à frente'; card.fx = null; await mostrarEspecial(card); T.res.extras.push('Troca: ninguém perto o bastante.'); break; }
      if(r.posicao < alvo.checkpoint){ card.texto = `${alvo.nome} está protegido pelo checkpoint`; card.fx = null; await mostrarEspecial(card); break; }
      if(alvo.escudo){ usaEscudo(alvo, 'a troca'); card.texto = `O escudo de ${alvo.nome} anulou a troca`; card.fx = null; await mostrarEspecial(card); renderTab(); break; }
      marcar(); card.texto = `Trocou de lugar com ${alvo.nome}!`; card.alvo = alvo.id; await mostrarEspecial(card);

/* Sons sintetizados pelo navegador (Web Audio): nenhum arquivo. O mudo fica guardado neste navegador (tecla M). */
const K_SOM = 'osvaldoland-som', SOM = {ctx:null, mudo:false};
try { SOM.mudo = localStorage.getItem(K_SOM) === 'mudo'; } catch(e){}
function audio(){
  if(SOM.mudo) return null;
  try {
    if(!SOM.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; SOM.ctx = new AC(); }
    if(SOM.ctx.state === 'suspended') SOM.ctx.resume();
    return SOM.ctx;

}
function nota(c, t0, freq, dur, {tipo = 'sine', vol = .18, ate = null} = {}){
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(freq, t0); if(ate) o.frequency.exponentialRampToValueAtTime(ate, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .03);
}
const SONS = {
  tic: (c, t) => nota(c, t, 880, .08, {tipo:'square', vol:.05}),
  ticFinal: (c, t) => nota(c, t, 1320, .12, {tipo:'square', vol:.08}),
  tempo: (c, t) => { nota(c, t, 520, .75, {tipo:'sawtooth', vol:.11, ate:110}); nota(c, t + .05, 260, .7, {tipo:'square', vol:.05, ate:70}); },
  acerto: (c, t) => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => nota(c, t + i*.085, f, i === 3 ? .5 : .16, {tipo:'triangle', vol:.22})),
  erro: (c, t) => { nota(c, t, 311.13, .2, {tipo:'square', vol:.08}); nota(c, t + .2, 207.65, .42, {tipo:'square', vol:.08}); },
  vez: (c, t) => { nota(c, t, 783.99, .25, {vol:.18}); nota(c, t + .13, 1174.66, .6, {vol:.16}); },
  vitoria: (c, t) => [523.25, 659.25, 783.99, 659.25, 783.99, 1046.5].forEach((f, i) => nota(c, t + [0, .12, .24, .42, .54, .66][i], f, i === 5 ? 1 : .15, {tipo:'triangle', vol:.22})),
};

/* =============================== PAUSA, CRONÔMETRO, AUTOAVANÇO =============================== */
function togglePausa(){ if(S.tela !== 'jogo') return; T.pausado = !T.pausado; render(); }
function agendarAuto(ms, fn){ T.auto = {restante:ms, total:ms, fn}; acordar(); }
/* O laço só roda quando há cronômetro ou autoavanço contando. Um requestAnimationFrame permanente forçaria um
   quadro no thread principal a cada 16 ms, e a cada quadro o navegador recalcula o estilo de todas as casas animadas. */
let ultimo = performance.now(), rodando = false;
function precisaLoop(){ return S.tela === 'jogo' && !T.pausado && !T.modal && !!(T.auto || (S.duelo && S.duelo.ativo && S.fase === 'pergunta')); }
function acordar(){ if(!rodando && precisaLoop()){ rodando = true; ultimo = performance.now(); requestAnimationFrame(loop); } }
function loop(t){
  const dt = Math.max(0, t - ultimo); ultimo = t;
  if(S.tela === 'jogo' && !T.pausado && !T.modal){
    const d = S.duelo;
    if(d && d.ativo && S.fase === 'pergunta'){
      d.restante -= dt;
      const s = segs(d.restante);
      if(s !== T.ultSeg){
        if(T.ultSeg != null && s <= 10 && s > 0) som(s <= 3 ? 'ticFinal' : 'tic');
        T.ultSeg = s;
        const n = document.getElementById('cr-n'), a = document.getElementById('cr-a');
        if(n) n.textContent = s;
        if(a) a.setAttribute('stroke-dashoffset', (251.33*(1 - Math.max(0, d.restante - 1000)/(S.config.tempo*1000))).toFixed(2));
      }
      if(!T.alerta && d.restante <= 10000){ T.alerta = true; render(); }
      if(d.restante <= 0){ d.restante = 0; tempoEsgotado(); }
    }
    if(T.auto){
      T.auto.restante -= dt;
      const b = document.getElementById('auto-barra'); if(b) b.style.transform = `scaleX(${Math.min(1, Math.max(0, 1 - T.auto.restante/T.auto.total)).toFixed(3)})`;
      if(T.auto.restante <= 0){ const fn = T.auto.fn; T.auto = null; fn(); }
    }
  }
  if(precisaLoop()) requestAnimationFrame(loop); else rodando = false;
}

  const k = e.key;
  if(e.target.closest && e.target.closest('input, textarea, select')){ if(k === 'Escape' && T.modal){ acoes.fecharModal(); } return; }
  if(e.target.matches && e.target.matches('label[for=arqBanco]') && (k === 'Enter' || k === ' ')){ e.preventDefault(); $('#arqBanco').click(); return; }
  if(k === 'Escape' && T.modal){ e.preventDefault(); acoes.fecharModal(); return; }
  if(T.modal) return;
  if(S.tela === 'ordem' && (k === ' ' || k === 'Enter')){ e.preventDefault(); comecarJogo(); return; }
  if(S.tela !== 'jogo') return;
  if((k === 'm' || k === 'M') && !e.ctrlKey && !e.metaKey){ e.preventDefault(); acoes.som(); return; }
  if(k === 'Escape'){ e.preventDefault(); togglePausa(); return; }
  if(T.pausado) return;
  if(T.especial && (k === ' ' || k === 'Enter')){ e.preventDefault(); if(T.pular) T.pular(); return; }
  if((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); desfazer(); return; }
  if(e.target.tagName === 'BUTTON' && (k === ' ' || k === 'Enter') && !['validacao'].includes(S.fase)) return;
  const n = /^[0-9]$/.test(k) ? (+k || 10) : 0, ok = k === ' ' || k === 'Enter', j = atual(), d = S.duelo;
  let usou = true;
  switch(S.fase){
    case 'inicio': if(ok) irOponente(); else usou = false; break;
    case 'oponente': { const l = listaOponentes(j); if(n && l[n-1]) escolherOponente(l[n-1].id); else usou = false; break; }
    case 'categoria': if(n && CAT_IDS[n-1]) escolherCategoria(CAT_IDS[n-1]); else usou = false; break;
    case 'categoria_imposta': if(ok) confirmarCategoria(); else usou = false; break;
    case 'dificuldade': if(n >= 1 && n <= 3) escolherDificuldade(n); else usou = false; break;
    case 'pergunta': { const q = d.tipo === 'todos' ? ativos() : [jog(d.desafiante), jog(d.desafiado)]; if(n && q[n-1]) marcar(q[n-1].id); else if(k === 'p' || k === 'P') desistir(); else usou = false; break; }
    case 'resposta': if(ok) revelar(); else if(k === 'Backspace') voltarMarcacao(); else usou = false; break;
    case 'validacao': if(k === 'Enter') validar(true); else if(k === 'Backspace') validar(false); else usou = false; break;
    case 'erro_rebote': if(ok) fazerRebote(); else if(k === 'Backspace') pularRebote(); else usou = false; break;
    case 'resultado': case 'tempo_esgotado': case 'congelado': if(ok) acoes.proximo(); else usou = false; break;
    default: usou = false;
  }
  if(usou) e.preventDefault();
});

ajustar(); render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(!T.ocupado) render(); });
</script>
