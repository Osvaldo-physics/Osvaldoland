<title>OsvaldoLand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face{font-family:'Material Symbols Rounded';font-style:normal;font-weight:400 800;font-display:block;src:url(data:font/woff2;base64,__ICONES__) format('woff2')}
/* Palco fixo de 1920×1080 (TV/projetor), escalado para caber na janela. Visual único, escuro, de game show.
   Tokens abaixo seguem o design OsvaldoLand (Claude Design). */
:root{
  color-scheme: dark;
  --noite:#1E1B4B; --noite-2:#0F0C3A; --tinta:#1E1B4B; --tinta-2:#4A477A; --tinta-3:#6B6890;
  --linha:#D9D7EE; --suave:#F1F0FA; --suave-2:#EEEDF6; --indigo:#4F46E5; --indigo-esc:#3730A3;
  --ouro:#FFD23F; --ouro-esc:#C99A00; --lilas:#B9B6E8;
  --baloo:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --nunito:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%}
body{
  margin:0; background:var(--noite-2); color:#fff; overflow:hidden; box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0;
  display:flex; align-items:center; justify-content:center; font-family:var(--nunito);
}
#moldura{position:relative; flex:none; border-radius:10px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.06)}
#palco{position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; color:var(--tinta); font-family:var(--nunito); background:var(--noite)}
#tela,#fx,#sobre{position:absolute; inset:0}
#tela{isolation:isolate; z-index:0} #fx{z-index:1} #sobre{z-index:2}
#l-tab{z-index:0} #l-frente{z-index:1}
#fx{pointer-events:none} #fx .clicavel{pointer-events:auto}
#sobre:empty{display:none}
.abs{position:absolute}
.bal{font-family:var(--baloo); font-weight:800; line-height:1}
.ms{font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; display:inline-block; font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; overflow:hidden; flex:none}
.rotulo{font-weight:900; font-size:28px; letter-spacing:3px; color:var(--tinta-3)}
.flex1{flex:1}
.linha{display:flex; align-items:center}

/* Botões */
button{font:inherit; color:inherit; background:none; border:none; padding:0; margin:0; cursor:pointer; text-align:inherit}
button:focus-visible,input:focus-visible,.foco:focus-visible{outline:6px solid #FDE047; outline-offset:5px}
button[disabled]{cursor:not-allowed}
.b3d{transition:transform .08s ease, box-shadow .08s ease, background .12s ease; display:flex; align-items:center; justify-content:center; gap:14px; font-family:var(--baloo); font-weight:800; line-height:1}
.b3d .ms{margin-top:-4px}
.amarelo{background:var(--ouro); color:var(--tinta); border-radius:24px; box-shadow:0 8px 0 var(--ouro-esc),0 16px 28px rgba(10,8,40,.25)}
.amarelo:hover{transform:translateY(-3px); background:#FFDC5E; box-shadow:0 11px 0 var(--ouro-esc),0 20px 32px rgba(10,8,40,.3)}
.amarelo:active{transform:translateY(6px); box-shadow:0 2px 0 var(--ouro-esc)}
.branco{background:#fff; color:#312E81; border-radius:24px; box-shadow:0 9px 0 var(--lilas)}
.branco:hover{transform:translateY(-3px)}
.branco:active{transform:translateY(7px); box-shadow:0 2px 0 var(--lilas)}
.verde{background:linear-gradient(180deg,#4ADE80,#22C55E 60%); color:#052E16; border-radius:30px; box-shadow:0 12px 0 #15803D,0 0 60px rgba(34,197,94,.45)}
.verde:hover{transform:translateY(-4px)}
.verde:active{transform:translateY(10px); box-shadow:0 2px 0 #15803D}
.roxo{background:var(--indigo); color:#fff; border-radius:22px; box-shadow:0 8px 0 var(--indigo-esc)}
.roxo:hover{transform:translateY(-3px); background:#5B52F0}
.roxo:active{transform:translateY(6px); box-shadow:0 2px 0 var(--indigo-esc)}
.b3d[disabled]{opacity:.45; transform:none!important; filter:grayscale(.4)}
.link{display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:28px; color:#4338CA; text-decoration:underline; text-underline-offset:5px}
.link:hover{color:var(--tinta)}

/* Peças e casas */
.peao{display:inline-block; position:relative; flex:none; vertical-align:bottom}
.peao svg{display:block; overflow:visible; width:100%; height:100%}
.casa{position:relative; display:inline-block; flex:none}
.casa-f{position:absolute; inset:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; overflow:hidden}
.casa-d{position:absolute; animation:anel 1.3s ease-in-out infinite}

/* Cronômetro */
.crono{position:relative; flex:none}
.crono-disco{position:absolute; inset:0; border-radius:50%; border:8px solid #fff; box-sizing:border-box; box-shadow:0 10px 0 rgba(30,27,75,.18),0 18px 34px rgba(10,8,40,.25)}
.crono svg{position:absolute; inset:0; transform:rotate(-90deg)}
.crono-arco{transition:stroke-dashoffset 1s linear}
.crono-c{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.crono.alerta{animation:pulsa 1s ease-in-out infinite}

/* Tabuleiro */
.tab{position:relative; width:1160px; height:716px; border-radius:36px; overflow:hidden; background:linear-gradient(180deg,#25AED6 0%,#1583B5 100%); box-shadow:0 0 0 6px rgba(255,255,255,.9),0 24px 60px rgba(8,6,35,.55)}
.pc{position:absolute; left:0; top:0; transition:transform .2s ease; will-change:transform}
#l-tab.desfocado{filter:blur(10px); opacity:.7}
#tab-casas,#tab-mov,#tab-pecas{position:absolute; inset:0}
#tab-mov,#tab-pecas{pointer-events:none}

/* Mesa */
.topo{position:absolute; left:28px; top:24px; width:1864px; height:100px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center}
.pill-vidro{height:58px; padding:0 22px; box-sizing:border-box; border-radius:999px; background:rgba(255,255,255,.12); border:3px solid rgba(255,255,255,.28); display:flex; align-items:center; gap:10px; color:#fff; font-weight:800; font-size:28px; white-space:nowrap}
.painel{position:absolute; left:1208px; top:144px; width:684px; height:716px; box-sizing:border-box; border-radius:28px; background:rgba(255,255,255,.96); border:6px solid var(--b,#EF4444); box-shadow:0 0 0 5px rgba(255,255,255,.22),0 0 60px var(--g,transparent),0 24px 60px rgba(8,6,35,.5); padding:26px 30px 30px; display:flex; flex-direction:column; gap:16px; animation:entra .28s ease-out}
.cartoes{position:absolute; left:28px; top:884px; width:1864px; height:176px; display:grid; gap:20px}
.cartao{position:relative; height:176px; box-sizing:border-box; border-radius:24px; background:rgba(255,255,255,.96); display:flex; align-items:center; gap:16px; padding:0 20px; min-width:0; transition:transform .2s}
.op-linha{flex:none; box-sizing:border-box; border-radius:24px; display:flex; align-items:center; gap:18px; padding:0 20px 0 22px; font-family:inherit; text-align:left; transition:transform .1s ease, box-shadow .1s ease}
button.op-linha:hover{transform:translateX(-8px) scale(1.02)}
button.op-linha:active{transform:translateY(6px)}
.raios{position:absolute; left:50%; top:50%; width:1000px; height:1000px; margin:-500px 0 0 -500px; animation:gira 50s linear infinite; will-change:transform}
.brilho-pulsa{animation:brilha 2.4s ease-in-out infinite; will-change:transform,opacity}
.dif{flex:none; box-sizing:border-box; border:5px solid #fff; border-radius:28px; display:flex; align-items:center; gap:20px; padding:0 18px 0 30px; text-align:left; transition:transform .1s, box-shadow .1s}
.dif:hover{transform:translateY(-3px) scale(1.02)}
.dif:active{transform:translateY(7px)}
.dif .estrelas .ms{animation:acende .35s both}
.cat-card{position:relative; box-sizing:border-box; border-radius:26px; background:#fff; overflow:hidden; display:flex; flex-direction:column; padding:0; transition:transform .12s, box-shadow .12s; animation:entra .35s both}
.cat-card:hover{transform:translateY(-8px) scale(1.03)}
.cat-card:active{transform:translateY(6px)}

/* Duelo */
.podio{position:relative; box-sizing:border-box; border-radius:30px; display:flex; align-items:center; gap:28px; padding:0 40px; font-family:inherit; transition:transform .12s}
button.podio:not([disabled]):hover{transform:translateY(-4px)}
button.podio:not([disabled]):active{transform:translateY(8px)}
.podio[disabled]{cursor:not-allowed}
.selo{animation:selo .5s cubic-bezier(.3,1.6,.5,1) both}
.todos-card{box-sizing:border-box; border-radius:30px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:10px; padding:0 8px 22px; font-family:inherit; transition:transform .12s}
.todos-card:not([disabled]){animation:balanca 1.6s ease-in-out infinite}
.todos-card:not([disabled]):hover{transform:translateY(-6px) scale(1.03); animation:none}
.todos-card[disabled]{opacity:.4; filter:grayscale(.6); cursor:not-allowed}
.alerta-borda{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 16px #EF4444,inset 0 0 160px rgba(239,68,68,.75); animation:pisca 1s ease-in-out infinite}
.vira{animation:vira .35s ease-out both; transform-origin:50% 0}
.simnao{height:180px; box-sizing:border-box; border:6px solid #fff; border-radius:34px; display:flex; align-items:center; justify-content:center; gap:20px; font-family:var(--baloo); font-weight:800; font-size:96px; line-height:1; transition:transform .1s, box-shadow .1s}
.simnao:hover{transform:translateY(-4px)}
.simnao:active{transform:translateY(10px)}

/* Overlays */
.veu{position:absolute; inset:0; background:rgba(12,10,40,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; animation:fade .18s ease-out}
.modal{position:absolute; box-sizing:border-box; border-radius:36px; background:#fff; border:6px solid var(--indigo); box-shadow:0 0 0 6px rgba(255,255,255,.3),0 30px 80px rgba(0,0,0,.5); display:flex; flex-direction:column; animation:mola .3s cubic-bezier(.3,1.5,.5,1) both}
.chip{height:72px; padding:0 28px; box-sizing:border-box; border-radius:999px; border:4px solid var(--linha); display:flex; align-items:center; gap:8px; font-weight:800; font-size:30px; color:var(--tinta-2); background:#fff; transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--indigo); border-color:var(--indigo); color:#fff; font-weight:900; box-shadow:0 5px 0 var(--indigo-esc)}
.seg{height:80px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:var(--baloo); font-weight:800; font-size:40px; line-height:1; color:var(--tinta-2)}
.seg.on{background:var(--indigo); box-shadow:0 5px 0 var(--indigo-esc); color:#fff}
.seg[disabled]{opacity:.4}
.chave{width:116px; height:64px; box-sizing:border-box; border-radius:999px; padding:6px; display:flex; flex:none; box-shadow:inset 0 3px 0 rgba(0,0,0,.12); transition:background .15s}
.chave span.bola{width:52px; height:52px; border-radius:50%; background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
input[type=range].faixa{-webkit-appearance:none; appearance:none; width:100%; height:80px; background:transparent; margin:0; cursor:pointer}
input[type=range].faixa::-webkit-slider-runnable-track{height:20px; border-radius:999px; background:linear-gradient(90deg,var(--indigo) var(--p),#E4E2F3 var(--p))}
input[type=range].faixa::-moz-range-track{height:20px; border-radius:999px; background:#E4E2F3}
input[type=range].faixa::-moz-range-progress{height:20px; border-radius:999px; background:var(--indigo)}
input[type=range].faixa::-webkit-slider-thumb{-webkit-appearance:none; width:64px; height:64px; margin-top:-22px; box-sizing:border-box; border-radius:50%; background:#fff; border:8px solid var(--indigo); box-shadow:0 5px 0 var(--indigo-esc)}
input[type=range].faixa::-moz-range-thumb{width:48px; height:48px; border-radius:50%; background:#fff; border:8px solid var(--indigo); box-shadow:0 5px 0 var(--indigo-esc)}

/* Cadastro */
.jog-linha{box-sizing:border-box; border-radius:24px; background:rgba(255,255,255,.96); box-shadow:0 8px 0 rgba(10,8,40,.35); display:flex; align-items:center; gap:22px; padding:0 22px 0 18px; animation:entra .25s ease-out both}
.nome-caixa{width:380px; height:80px; box-sizing:border-box; border-radius:18px; background:#F6F5FD; border:4px solid var(--linha); display:flex; align-items:center; padding:0 18px; gap:10px}
.nome-caixa:focus-within{border-color:var(--indigo); background:#fff}
.nome-caixa input{flex:1; min-width:0; border:none; background:transparent; outline:none; font-family:var(--baloo); font-weight:800; font-size:44px; line-height:1; color:var(--tinta); padding:6px 0 0}
.bolinha{position:relative; width:62px; height:62px; box-sizing:border-box; border-radius:50%; border:4px solid #fff; display:flex; align-items:center; justify-content:center; transition:transform .1s}
.bolinha:not([disabled]):hover{transform:scale(1.1)}
.risco{position:absolute; left:-6px; right:-6px; top:50%; height:7px; margin-top:-3.5px; border-radius:4px; background:var(--tinta); transform:rotate(-45deg); box-shadow:0 0 0 2px #fff}
.x-btn{width:72px; height:72px; border-radius:20px; background:var(--suave); color:var(--tinta-2); display:flex; align-items:center; justify-content:center; flex:none}
.x-btn:hover{background:#FEE2E2; color:#B91C1C}

/* Abertura e sorteio */
.logo-svg{animation:mola .7s cubic-bezier(.3,1.5,.5,1) both}
.placa{animation:placa 3.2s ease-in-out infinite; transform-origin:50% 0}
.bob{animation:bob 2.8s ease-in-out infinite}
.rolo{position:relative; border-radius:22px; overflow:hidden; background:linear-gradient(180deg,#CFCBEA 0%,#fff 30%,#fff 70%,#CFCBEA 100%); box-shadow:inset 0 0 0 5px #881337,inset 0 10px 20px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center}
.degrau{animation:sobeDegrau .5s cubic-bezier(.3,1.4,.5,1) both; transform-origin:50% 100%}
.cai{animation:cai linear infinite}

@keyframes anel{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.5; transform:scale(1.07)}}
@keyframes pulsa{50%{transform:scale(1.06)}}
@keyframes pulo{0%{transform:translateY(0)}45%{transform:translateY(-46px)}100%{transform:translateY(0)}}
@keyframes entra{from{opacity:0; transform:translateY(18px)}}
@keyframes fade{from{opacity:0}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes mola{0%{opacity:0; transform:scale(.7)}70%{opacity:1; transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes pop{0%{opacity:0; transform:scale(.6)}60%{opacity:1; transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes selo{0%{opacity:0; transform:translateY(-60px) rotate(-40deg)}100%{opacity:1; transform:rotate(3deg)}}
@keyframes vira{from{transform:perspective(900px) rotateX(85deg); opacity:.2}}
@keyframes pisca{50%{opacity:.45}}
@keyframes balanca{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes treme{0%,100%{transform:translateX(0)}17%,50%,83%{transform:translateX(-22px)}33%,67%{transform:translateX(22px)}}
@keyframes acende{from{opacity:0; transform:scale(.3)}}
@keyframes placa{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(-1.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes sobeDegrau{from{transform:scaleY(0)}}
@keyframes cai{from{transform:translateY(-140px) rotate(0)}to{transform:translateY(1240px) rotate(540deg)}}
@keyframes ampulheta{0%{transform:translateY(-320px) rotate(-60deg)}55%{transform:translateY(0) rotate(-14deg)}72%{transform:translateY(-36px) rotate(-12deg)}100%{transform:translateY(0) rotate(-14deg)}}
@keyframes coroa{0%{opacity:0; transform:translateY(-220px) rotate(-30deg)}70%{opacity:1; transform:translateY(8px) rotate(-6deg)}100%{transform:rotate(-8deg)}}
@keyframes some{0%{opacity:0; transform:scale(.6) rotate(-5deg)}12%{opacity:1; transform:scale(1.06) rotate(-5deg)}20%{transform:scale(1) rotate(-5deg)}80%{opacity:1}100%{opacity:0}}
@keyframes estoura{from{transform:translate(0,0) rotate(0); opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0}}
@keyframes brilha{50%{transform:scale(1.25); opacity:.55}}
@keyframes rodaRolo{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition:none!important}}
</style>

<div id="moldura"><div id="palco" role="application" aria-label="OsvaldoLand"><div id="tela"><div id="l-fundo" class="abs" style="inset:0"></div><div id="l-tab" class="abs" style="left:28px;top:144px"></div><div id="l-frente" class="abs" style="inset:0"></div></div><div id="fx"></div><div id="sobre"></div></div></div>

<script>
/* =============================== DADOS =============================== */
const BANCO_PADRAO = __BANCO__.map(q => ({id:q[0], categoria:q[1], dificuldade:q[2], enunciado:q[3], resposta:q[4]}));

const CATS = {

  E:{nome:'Esportes & Lazer',    curto:'Esportes',     cor:'#F97316', esc:'#C2410C', claro:'#FFEDD5', tinta:'#431407', texto:'#C2410C'},

  S:{nome:'Pop & Entretenimento',curto:'Pop',          cor:'#C026D3', esc:'#86198F', claro:'#FAE8FF', tinta:'#FFFFFF', texto:'#A21CAF'}
};
const CAT_IDS = Object.keys(CATS);
const SIGLA = {N:'N',H:'H',G:'G',A:'A',E:'E',C:'C',P:'P',S:'★'};
/* cor: [principal, escura, tinta sobre a cor, texto sobre branco] */
const PC = {
  vermelho:['#EF4444','#B91C1C','#FFFFFF','#DC2626'], azul:['#3B82F6','#1D4ED8','#FFFFFF','#2563EB'],
  verde:['#22C55E','#15803D','#052E16','#15803D'],   amarelo:['#FACC15','#CA8A04','#422006','#A16207'],
  roxo:['#8B5CF6','#6D28D9','#FFFFFF','#7C3AED'],    laranja:['#F97316','#C2410C','#431407','#C2410C'],
  rosa:['#EC4899','#BE185D','#FFFFFF','#DB2777'],    ciano:['#06B6D4','#0E7490','#083344','#0E7490'],
  lima:['#A3E635','#4D7C0F','#1A2E05','#4D7C0F'],    marrom:['#A16A3B','#5C3A1E','#FFFFFF','#7C4A22'],
  cinza:['#94A3B8','#475569','#0F172A','#475569'],   preto:['#3F3F46','#09090B','#FFFFFF','#27272A']
};
const NOME_COR = {vermelho:'Vermelho', azul:'Azul', verde:'Verde', amarelo:'Amarelo', roxo:'Roxo', laranja:'Laranja', rosa:'Rosa', ciano:'Ciano', lima:'Lima', marrom:'Marrom', cinza:'Cinza', preto:'Preto'};
const MAX_JOG = 12;
const COR_IDS = Object.keys(PC);
const TILES = {
  N:{cor:'#22C55E',esc:'#15803D',tinta:'#052E16',sim:'N'}, H:{cor:'#FACC15',esc:'#CA8A04',tinta:'#422006',sim:'H'},
  G:{cor:'#3B82F6',esc:'#1D4ED8',tinta:'#FFFFFF',sim:'G'}, A:{cor:'#8B5CF6',esc:'#6D28D9',tinta:'#FFFFFF',sim:'A'},
  E:{cor:'#F97316',esc:'#C2410C',tinta:'#431407',sim:'E'}, C:{cor:'#EF4444',esc:'#B91C1C',tinta:'#FFFFFF',sim:'C'},
  P:{cor:'#F9A8D4',esc:'#DB2777',tinta:'#500724',sim:'P'}, S:{cor:'#C026D3',esc:'#86198F',tinta:'#FFFFFF',ico:'star'},
  livre:{cor:'#F5B700',esc:'#B45309',tinta:'#3B2300',ico:'casino',esp:true},
  atalho:{cor:'#A3E635',esc:'#4D7C0F',tinta:'#1A2E05',ico:'fast_forward',esp:true},
  escorregao:{cor:'#DC2626',esc:'#7F1D1D',tinta:'#FFFFFF',ico:'fast_rewind',esp:true},
  escudo:{cor:'#38BDF8',esc:'#0369A1',tinta:'#082F49',ico:'shield',esp:true},

function gerarTabuleiro(N, seed){
  const f = N/32;
  const qtd = {atalho:Math.round(3*f), escorregao:Math.round(3*f), escudo:Math.max(1,Math.round(2*f)), todos:Math.max(1,Math.round(2*f)), congelado:Math.max(1,Math.round(f)), troca:Math.max(1,Math.round(f))};
  const nLivres = Math.round(4*f), cps = [Math.round(N*.34), Math.round(N*.69)];
  const MOV = ['atalho','escorregao','troca'];
  for(let t=0;t<400;t++){
    const rnd = mulberry32(seed + t*7919);
    const casas = Array.from({length:N+1}, (_,i) => ({i, tipo:'normal', cat:null, efeito:null, checkpoint:false}));
    casas[0].tipo = 'largada'; casas[N].tipo = 'chegada';
    cps.forEach(i => { casas[i].checkpoint = true; casas[i].cat = 'livre'; });
    for(let k=1;k<=nLivres;k++){ let i = Math.round(k*N/(nLivres+1)); while(casas[i].checkpoint) i++; casas[i].cat = 'livre'; }
    let ok = true;
    for(const ef of embaralhar(Object.entries(qtd).flatMap(([e,n]) => Array(n).fill(e)), rnd)){
      const cand = [];
      for(let i=4;i<N;i++){
        const c = casas[i];
        if(c.cat || c.efeito) continue;
        if(ef === 'atalho' && i > N-4) continue;
        if(ef === 'troca' && i <= N/2) continue;
        if(MOV.includes(ef) && casas.some(o => o.efeito && MOV.includes(o.efeito) && Math.abs(o.i-i) < 3)) continue;
        cand.push(i);
      }
      if(!cand.length){ ok = false; break; }
      casas[cand[Math.floor(rnd()*cand.length)]].efeito = ef;
    }
    if(!ok) continue;
    const vazias = casas.filter(c => c.tipo === 'normal' && !c.cat && !c.efeito);
    let pool = []; while(pool.length < vazias.length) pool = pool.concat(embaralhar(CAT_IDS, rnd));
    vazias.forEach((c,k) => c.cat = pool[k]);
    for(let k=1;k<vazias.length;k++) if(vazias[k].cat === vazias[k-1].cat){
      const m = vazias.findIndex((c,x) => x > k+1 && c.cat !== vazias[k].cat && c.cat !== vazias[k-1].cat);
      if(m > -1){ const tmp = vazias[k].cat; vazias[k].cat = vazias[m].cat; vazias[m].cat = tmp; }
    }
    return {casas, checkpoints:cps};
  }
  throw new Error('Não foi possível gerar o tabuleiro');
}

/* Histórico entre partidas: cada pergunta guarda a ordem em que foi vista pela última vez neste navegador.

const K_HIST = 'osvaldoland-vistas';
let HIST = null;
function historico(){ if(!HIST){ const h = ler(K_HIST, null); HIST = h && h.v ? h : {seq:0, v:{}}; } return HIST; }
function escolherMenosVista(lista){
  const h = historico().v, nunca = lista.filter(q => !(q.id in h));
  if(nunca.length) return nunca[Math.floor(Math.random()*nunca.length)];
  const ord = lista.slice().sort((a,b) => h[a.id] - h[b.id]), k = Math.max(1, Math.ceil(ord.length/4));
  return ord[Math.floor(Math.random()*k)];
}
function marcarVista(id){
  const H = historico(); H.v[id] = ++H.seq;
  const ids = Object.keys(H.v);
  if(ids.length > 3000) ids.sort((a,b) => H.v[a] - H.v[b]).slice(0, ids.length - 2000).forEach(x => delete H.v[x]);
  gravar(K_HIST, H);
}
function usar(q){ S.usadas.push(q.id); usadasSet().add(q.id); if(q.id !== 'vazio') marcarVista(q.id); return q; }
function sortearPergunta(cat, dif){
  const ix = indiceBanco(), us = usadasSet(), pega = escolherMenosVista;
  const ordem = [dif, ...[1,2,3].filter(x => x !== dif).sort((a,b) => Math.abs(a-dif) - Math.abs(b-dif))];
  for(const df of ordem){
    const livres = (ix.grupo.get(cat + df) || []).filter(q => !us.has(q.id));
    if(livres.length) return usar(pega(livres));
  }
  const ids = ix.porCat.get(cat);
  if(!ids) return {id:'vazio', categoria:cat, dificuldade:dif, enunciado:'O banco não tem perguntas desta categoria. O juiz faz uma pergunta de cabeça!', resposta:'(definida pelo juiz)'};
  S.usadas = S.usadas.filter(id => !ids.has(id));
  const l = ix.grupo.get(cat + dif) || ordem.map(df => ix.grupo.get(cat + df)).find(x => x && x.length);
  return usar(pega(l));
}
function normalizarBanco(dados){

  mapa['★'] = 'S'; mapa['pop'] = 'S';
  const ok = []; let rej = 0;
  lista.forEach((q, i) => {

    if(cat && [1,2,3].includes(dif) && q.enunciado && q.resposta) ok.push({id: String(q.id || 'i' + (i+1)), categoria:cat, dificuldade:dif, enunciado:String(q.enunciado), resposta:String(q.resposta)});

async function mover(j, delta){
  const piso = delta < 0 ? j.checkpoint : 0;
  const de = j.posicao, ate = Math.max(piso, Math.min(S.N, de + delta));
  j.posicao = ate; atualizarCheckpoint(j);
  if(ate !== de){
    const [c] = PC[j.cor];
    T.mov = ate > de ? {id:j.id, de, dir:1, cor:j.cor, num:j.num, trilha:c, anel:c} : {id:j.id, de, dir:-1, cor:j.cor, num:j.num, trilha:'#B91C1C', anel:'#EF4444'};
    await animar(j.id, de, ate);
  }
  if(ate >= S.N) vencer(j);
  return ate - de;
}
function usaEscudo(j, oque){ if(!j.escudo) return false; j.escudo = false; T.res && T.res.extras.push(`O escudo de ${j.nome} anulou ${oque}.`); return true; }
async function aplicarPunicao(r, dif){
  const p = S.config.punicao;
  if(p === 'nenhuma'){ T.res.penal = 'Sem punição nesta partida.'; return; }
  if(usaEscudo(r, 'a punição')){ T.res.penal = 'O escudo anulou a punição.'; return; }
  if(p === 'perdeTurno'){ r.congelado = true; T.res.penal = `${r.nome} perde a próxima vez.`; return; }
  const n = p === 'volta1' ? 1 : dif, real = r.posicao - Math.max(r.checkpoint, r.posicao - n);
  if(real > 0) mostrarBig(`−${real} ${plural(real,'casa','casas')}`, 'erro');
  const a = await mover(r, -n);
  if(!a) T.res.penal = `${r.nome} está no piso (largada ou checkpoint) e não volta.`;
}
async function efeitoCasa(r){
  const c = S.casas[r.posicao]; if(!c || !c.efeito) return;
  const e = c.efeito, card = {tipo:e, j:r.id, casa:r.posicao, titulo:EFEITOS[e].nome + '!', texto:''};
  const marcas = r.marcas = r.marcas || [], aqui = r.posicao, marcar = () => { if(!marcas.includes(aqui)) marcas.push(aqui); };
  if(marcas.includes(aqui)){
    card.texto = 'Você já usou esta casa: o efeito não vale de novo'; card.imune = true;
    T.res.extras.push(`${EFEITOS[e].nome}: ${r.nome} já usou esta casa, nada acontece.`);
    await mostrarEspecial(card); return;
  }
  switch(e){
    case 'atalho': marcar(); card.texto = 'Avance 2 casas!'; await mostrarEspecial(card); { const a = await mover(r, 2); T.res.extras.push(`Atalho: +${a} ${plural(a,'casa','casas')}.`); } break;
    case 'escorregao':
      if(r.escudo){ usaEscudo(r, 'o escorregão'); card.texto = 'O escudo te protegeu!'; await mostrarEspecial(card); break; }
      marcar(); card.texto = 'Volte 2 casas'; await mostrarEspecial(card);
      { const a = await mover(r, -2); T.res.extras.push(a ? `Escorregão: voltou ${-a} ${plural(a,'casa','casas')}.` : 'Escorregão: protegido pelo checkpoint.'); } break;
    case 'escudo':
      if(r.escudo){ card.texto = 'Você já tem um escudo'; T.res.extras.push('Escudo: já tinha um (não acumula).'); }
      else { marcar(); r.escudo = true; card.texto = 'Anula o próximo efeito negativo'; T.res.extras.push(`${r.nome} ganhou um escudo.`); }
      await mostrarEspecial(card); break;
    case 'congelado':
      if(r.escudo){ usaEscudo(r, 'o congelamento'); card.texto = 'O escudo te protegeu!'; }
      else { marcar(); r.congelado = true; card.texto = 'Você perde o próximo turno'; T.res.extras.push(`${r.nome} perde a próxima vez.`); }
      await mostrarEspecial(card); break;
    case 'troca': {
      const alvo = ativos().filter(j => j.id !== r.id && j.posicao > r.posicao && j.posicao - r.posicao <= 5).sort((a,b) => a.posicao - b.posicao)[0];
      if(!alvo){ card.texto = 'Ninguém a até 5 casas à frente'; await mostrarEspecial(card); T.res.extras.push('Troca: ninguém perto o bastante.'); break; }
      if(r.posicao < alvo.checkpoint){ card.texto = `${alvo.nome} está protegido pelo checkpoint`; await mostrarEspecial(card); break; }
      marcar(); card.texto = `Trocou de lugar com ${alvo.nome}!`; card.alvo = alvo.id; await mostrarEspecial(card);
      const pr = r.posicao, pa = alvo.posicao; r.posicao = pa; alvo.posicao = pr; atualizarCheckpoint(r); T.mov = null;
      await Promise.all([animar(r.id, pr, pa), animar(alvo.id, pa, pr)]);
      T.res.extras.push(`Troca: ${r.nome} ↔ ${alvo.nome}.`); break;
    }
    case 'todos':
      marcar(); card.texto = 'Pergunta aberta a todos: quem acertar avança 1'; await mostrarEspecial(card);
      iniciarTodos(r); return 'todos';
  }
}
function iniciarTodos(origem){
  S.duelo = {tipo:'todos', origem:origem.id, desafiante:null, desafiado:null, elegiveis:ativos().map(j => j.id), categoria:CAT_IDS[Math.floor(Math.random()*CAT_IDS.length)], dificuldade:2, pergunta:null, respondeuId:null, restante:S.config.tempo*1000, ativo:false, emRebote:false};

function vencer(j){ if(S.vencedor) return; S.vencedor = j.id; S.tela = 'vitoria'; S.fase = null; T.auto = null; T.big = null; T.especial = null; apagar(K_SAVE); setTimeout(render, REDUZ ? 0 : 700); }
function desfazer(){
  if(!T.snapshot || T.ocupado || !['resultado','erro_rebote'].includes(S.fase)) return;
  const {cad, banco} = S; S = {...clone(T.snapshot.S), cad, banco};

function juiz(){
  const d = S.duelo; if(ativos().length <= 2) return null;
  const exclui = d && d.tipo === 'normal' ? [d.desafiante, d.desafiado] : (d && d.respondeuId ? [d.respondeuId] : [atual().id]);
  for(let k=1;k<=S.ordem.length;k++){ const j = jog(S.ordem[(S.vez + k) % S.ordem.length]); if(j.ativo && !exclui.includes(j.id)) return j; }
  return null;
}

let ultimo = performance.now();
function loop(t){
  const dt = t - ultimo; ultimo = t;
  if(S.tela === 'jogo' && !T.pausado && !T.modal){
    const d = S.duelo;
    if(d && d.ativo && S.fase === 'pergunta'){
      d.restante -= dt;
      const s = segs(d.restante);
      if(s !== T.ultSeg){

        const n = document.getElementById('cr-n'), a = document.getElementById('cr-a');
        if(n) n.textContent = s;
        if(a) a.setAttribute('stroke-dashoffset', (251.33*(1 - Math.max(0, d.restante - 1000)/(S.config.tempo*1000))).toFixed(2));
      }
      if(!T.alerta && d.restante <= 10000){ T.alerta = true; render(); }
      if(d.restante <= 0){ d.restante = 0; tempoEsgotado(); }

    if(T.auto){

}

/* =============================== TELA: DUELO =============================== */
function telaDuelo(){

      <button class="simnao" data-a="validar" data-v="0" style="background:linear-gradient(180deg,#F87171,#DC2626 60%);box-shadow:0 0 0 4px #DC2626,0 12px 0 #991B1B,0 22px 36px rgba(10,8,40,.25);color:#fff">${ico('close', 110, "font-variation-settings:'FILL' 1,'wght' 800")}NÃO</button></div>`;

function podio(id, papel, direita, tecla){
  const d = S.duelo, j = jog(id), [hx, ex, tn, tx] = PC[j.cor], reg = S.fase === 'resposta';
  const eleg = d.elegiveis.includes(id), marc = reg && d.respondeuId === id, apagado = (reg && !marc) || (!reg && !eleg);
  let st, h, pt, fs, t1, t2;
  if(marc){ h = 240; pt = 190; fs = 92; t1 = t2 = tn; st = `border:6px solid #fff;background:linear-gradient(180deg, color-mix(in oklab, ${hx}, #fff 25%), ${hx} 65%);box-shadow:0 0 0 6px ${hx},0 0 70px ${hx}bf,0 14px 0 ${ex}`; }
  else if(apagado){ h = 170; pt = 130; fs = 60; t1 = t2 = 'var(--tinta-2)'; st = `border:6px solid var(--linha);background:var(--suave-2);box-shadow:0 6px 0 #C9C6E0;opacity:.55`; }

    ${marc ? `<div class="abs linha bal selo" style="top:-36px;${direita ? 'left' : 'right'}:30px;height:64px;padding:0 26px 0 14px;box-sizing:border-box;border-radius:999px;background:#FACC15;border:5px solid #fff;box-shadow:0 6px 0 #A16207;gap:8px;color:#422006;font-size:34px">${ico('bolt', 38)}Respondeu primeiro!</div>` : ''}
    <div style="margin-top:-40px">${peaoJ(j, pt, {brilho:marc, esm:apagado})}</div>
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><div class="bal" style="font-size:${fs}px;color:${t1};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:6px">${esc(j.nome)}</div><div style="font-weight:900;font-size:32px;color:${t2}">${!eleg && !reg ? 'já respondeu' : papel}</div></div></button>`;
}

      <button class="b3d branco" data-a="irInicio" style="height:104px;padding:0 44px;border-radius:30px;font-size:42px;box-shadow:0 10px 0 var(--lilas)">${ico('home', 50)}Voltar ao início</button></div></div>
  <div class="abs" style="left:60px;top:${n > 6 ? 630 : 648}px;width:1800px;display:grid;grid-template-columns:repeat(${n > 6 ? Math.ceil(n/2) : n},minmax(0,1fr));gap:${n > 6 ? 12 : comp ? 16 : 24}px">

  return `<div class="veu" style="background:rgba(12,10,40,.82);backdrop-filter:blur(6px);gap:40px" role="dialog" aria-modal="true" aria-label="Partida pausada">
    <div class="linha" style="gap:70px"><div style="width:240px;height:240px;box-sizing:border-box;border-radius:56px;background:#fff;box-shadow:0 14px 0 var(--lilas),0 0 80px rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;gap:30px"><div style="width:44px;height:130px;border-radius:14px;background:var(--indigo)"></div><div style="width:44px;height:130px;border-radius:14px;background:var(--indigo)"></div></div>
      <div style="display:flex;flex-direction:column;gap:14px"><div class="bal" style="font-size:150px;line-height:.9;color:#fff;text-shadow:0 10px 0 #0F0C3A">Pausado</div>
        ${cron ? `<div class="linha" style="gap:18px;color:#E0E7FF;font-weight:800;font-size:32px">${crono(segs(d.restante), S.config.tempo, 'parado', 120)}<span>Cronômetro congelado em ${segs(d.restante)} s</span></div>` : `<div style="color:#E0E7FF;font-weight:800;font-size:32px">Rodada ${S.rodada} · vez de ${esc(atual().nome)}</div>`}</div></div>
    <div class="linha" style="gap:28px;margin-top:20px">
      <button class="b3d" data-a="pausa" style="height:110px;padding:0 56px;border-radius:28px;background:#22C55E;color:#052E16;font-size:48px;box-shadow:0 0 0 5px #fff,0 12px 0 #15803D">${ico('play_arrow', 56)}Continuar</button>
      <button class="b3d branco" data-a="abrirConfig" style="height:110px;padding:0 44px;border-radius:28px;font-size:44px;box-shadow:0 12px 0 var(--lilas)">${ico('settings', 50)}Configurações</button>
      <button class="b3d branco" data-a="sair" style="height:110px;padding:0 44px;border-radius:28px;font-size:44px;box-shadow:0 12px 0 var(--lilas)">${ico('save', 50)}Salvar e sair</button></div>
    ${T.semSalvar ? `<div class="linha" style="gap:12px;padding:14px 24px;border-radius:18px;background:#FEF3C7;color:#78350F;font-weight:800;font-size:28px">${ico('error', 36)}Este navegador não está guardando a partida. Se a página fechar, ela se perde.</div>` : ''}
    <div class="abs" style="left:0;right:0;bottom:0;padding:26px 60px 34px;background:rgba(0,0,0,.28);border-top:3px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:18px">
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px 22px">${[['0–9','escolhem (0 = 10º)'],['Espaço','avança'],['Enter','Sim'],['Backspace','Não'],['Esc','pausa'],['Ctrl+Z','desfaz']].map(([k, t]) => `<div class="linha" style="gap:12px;height:58px;padding:0 22px 0 10px;border-radius:16px;background:rgba(255,255,255,.1);color:#E0E7FF;font-weight:800;font-size:26px"><span style="height:40px;min-width:40px;padding:0 12px;box-sizing:border-box;border-radius:10px;background:#fff;color:#312E81;font-weight:900;font-size:24px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--lilas)">${k}</span>${t}</div>`).join('')}</div>
      <div class="linha" style="gap:10px;color:#C7C4F0;font-weight:700;font-size:26px">${ico('save', 30)}“Salvar e sair” guarda a partida no começo do turno atual.</div></div></div>`;
}

/* =============================== RENDER =============================== */
const FASES_DUELO = ['pergunta','resposta','validacao'];
function render(){
  let h = '', fk = 'discreto|7', tab = false, desf = false;
  if(S.tela === 'inicio') h = telaAbertura();
  else if(S.tela === 'cadastro') h = telaCadastro();
  else if(S.tela === 'ordem'){ h = telaOrdem(); if(T.sort && T.sort.pronto) fk = 'festa|7'; }
  else if(S.tela === 'jogo'){ tab = true; desf = FASES_DUELO.includes(S.fase); if(desf) T.big = null; h = desf ? telaDuelo() : telaMesa(); }
  else if(S.tela === 'vitoria'){ h = telaVitoria(); fk = 'festa|11'; }
  if(fk !== R.fundo){ R.fundo = fk; const [m, sm] = fk.split('|'); $('#l-fundo').innerHTML = fundo(m, +sm); }
  const lt = $('#l-tab');
  if(!tab){ if(R.casas){ lt.innerHTML = ''; R.casas = null; R.pecas = {}; } }
  else { if(R.casas !== S.casas) montarTab(); renderTab(); }
  lt.classList.toggle('desfocado', desf);
  const foco = document.activeElement && document.activeElement.id;
  $('#l-frente').innerHTML = h;
  let sobre = '';
  if(S.tela === 'jogo' && T.pausado) sobre += telaPausa();
  if(T.modal === 'config') sobre += modalConfig();
  if(T.modal === 'banco') sobre += modalBanco();
  $('#sobre').innerHTML = sobre;
  renderFx();
  if(foco){ const el = document.getElementById(foco); if(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) el.focus(); }
}
function ajustar(){
  const cs = getComputedStyle(document.body);
  const W = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = document.body.clientHeight;
  const k = Math.max(.1, Math.min(W/1920, H/1080));
  const m = $('#moldura'); m.style.width = Math.floor(1920*k) + 'px'; m.style.height = Math.floor(1080*k) + 'px';
  $('#palco').style.transform = `scale(${k})`;
}
addEventListener('resize', ajustar);

/* =============================== AÇÕES =============================== */
const acoes = {
  irCadastro(){ S.tela = 'cadastro'; render(); },
  irInicio(){ clearInterval(T.sortTimer); S = {tela:'inicio', cad:S.cad || lerCad()}; T = novoT(); render(); },
  continuar(){ carregarPartida(); },
  novaPartida(){ const js = S.cad.jogadores; if(js.length < 2 || !js.every(p => p.nome.trim())) return; novaPartida(); },
  jogarDeNovo(){ const cad = S.cad; S = {tela:'cadastro', cad}; novaPartida(); },
  resortear(){ iniciarSorteio(); },
  comecar(){ comecarJogo(); },
  cor(v){ const [i, c] = v.split('|'), js = S.cad.jogadores; if(js.some((p,k) => k != i && p.cor === c)) return; js[i].cor = c; gravar(K_CAD, S.cad); render(); const pv = document.getElementById('pv-' + i); if(pv) pv.firstElementChild.style.animation = 'pulo .35s'; },
  remover(v){ if(S.cad.jogadores.length <= 2) return; S.cad.jogadores.splice(+v, 1); gravar(K_CAD, S.cad); render(); },
  addJog(){ const js = S.cad.jogadores; if(js.length >= MAX_JOG) return; js.push({nome:'Jogador ' + (js.length+1), cor:COR_IDS.find(c => !js.some(p => p.cor === c))}); gravar(K_CAD, S.cad); render(); const el = document.getElementById('nome-' + (js.length-1)); if(el){ el.focus(); el.select(); } },
  abrirConfig(){ T.rasc = clone(S.tela === 'jogo' ? S.config : S.cad.config); T.modal = 'config'; render(); },
  abrirBanco(){ T.modal = 'banco'; T.msgBanco = null; T.colar = false; render(); },
  fecharModal(){ T.modal = null; T.rasc = null; render(); },
  rTrilha(v){ T.rasc.trilha = +v; render(); },
  rPunicao(v){ T.rasc.punicao = v; render(); },
  rToggle(v){ T.rasc[v] = !T.rasc[v]; render(); },
  salvarConfig(){
    if(S.tela === 'jogo'){ const t = S.config.trilha; S.config = {...T.rasc, trilha:t}; S.cad.config = {...S.cad.config, ...T.rasc, trilha:S.cad.config.trilha}; salvarPartida(); }
    else S.cad.config = clone(T.rasc);
    gravar(K_CAD, S.cad); T.modal = null; T.rasc = null; render();
  },
  colar(){ T.colar = !T.colar; render(); },
  aplicarColado(){ const t = $('#txtBanco'); if(t) importarBanco(t.value); },
  copiarBanco(){
    const txt = JSON.stringify(bancoAtual().map(({id,categoria,dificuldade,enunciado,resposta}) => ({id, categoria:categoria === 'S' ? '★' : categoria, dificuldade, enunciado, resposta})), null, 1);
    const falha = () => { T.colar = true; T.msgBanco = {tipo:'ok', txt:'Não deu para copiar sozinho: o banco está no campo acima, selecione e copie.'}; render(); const t = $('#txtBanco'); if(t){ t.value = txt; t.select(); } };
    try { navigator.clipboard.writeText(txt).then(() => { T.msgBanco = {tipo:'ok', txt:'Banco copiado. Cole num arquivo .json para editar.'}; render(); }, falha); } catch(e){ falha(); }
  },
  restaurarBanco(){ apagar(K_BANCO); T.msgBanco = {tipo:'ok', txt:'Voltamos ao banco oficial de 400 perguntas.'}; render(); },
  irOponente(){ irOponente(); },
  oponente(v){ escolherOponente(v); },
  categoria(v){ escolherCategoria(v); },
  confirmarCat(){ confirmarCategoria(); },
  dificuldade(v){ escolherDificuldade(+v); },
  marcar(v){ marcar(v); },
  voltarMarcacao(){ voltarMarcacao(); },
  revelar(){ revelar(); },
  validar(v){ validar(v === '1'); },
  rebote(){ fazerRebote(); },
  pularRebote(){ pularRebote(); },
  proximo(){ if(['resultado','tempo_esgotado','congelado'].includes(S.fase) && !T.ocupado) proximoTurno(); },
  desfazer(){ desfazer(); },
  pausa(){ togglePausa(); },
  pularFx(){ if(T.pular) T.pular(); },
  sair(){ T.pausado = false; acoes.irInicio(); }
};
function importarBanco(txt){
  try { const {ok, rej} = normalizarBanco(JSON.parse(txt));
    if(!gravar(K_BANCO, ok)) throw new Error('O navegador não deixou guardar este banco (sem espaço ou modo anônimo). O banco anterior continua em uso.');
    T.colar = false; T.msgBanco = {tipo:'ok', txt:`${ok.length} perguntas carregadas${rej ? `; ${rej} ignoradas por estarem incompletas` : ''}.`}; }
  catch(e){ T.msgBanco = {tipo:'erro', txt: e instanceof SyntaxError ? 'O texto não é um JSON válido. Confira vírgulas, aspas e colchetes.' : e.message}; }
  render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const f = acoes[b.dataset.a]; if(f){ e.preventDefault(); f(b.dataset.v, b); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.nome !== undefined){
    const i = +t.dataset.nome; S.cad.jogadores[i].nome = t.value; gravar(K_CAD, S.cad);
    const c = document.getElementById('cont-' + i); if(c) c.textContent = t.value.length + '/12';
    const b = $('#btnComecar'); if(b) b.disabled = !S.cad.jogadores.every(p => p.nome.trim());
  }
  if(t.id === 'r-tempo'){ T.rasc.tempo = +t.value; $('#r-tempo-v').textContent = t.value; t.style.setProperty('--p', ((t.value - 30)/90*100).toFixed(1) + '%'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'arqBanco' && t.files && t.files[0]){ const fr = new FileReader(); fr.onload = () => importarBanco(String(fr.result)); fr.readAsText(t.files[0]); }
});
document.addEventListener('keydown', e => {
  const k = e.key;
  if(e.target.closest && e.target.closest('input, textarea, select')){ if(k === 'Escape' && T.modal){ acoes.fecharModal(); } return; }
  if(e.target.matches && e.target.matches('label[for=arqBanco]') && (k === 'Enter' || k === ' ')){ e.preventDefault(); $('#arqBanco').click(); return; }
  if(k === 'Escape' && T.modal){ e.preventDefault(); acoes.fecharModal(); return; }
  if(T.modal) return;
  if(S.tela === 'ordem' && (k === ' ' || k === 'Enter')){ e.preventDefault(); comecarJogo(); return; }
  if(S.tela !== 'jogo') return;
  if(k === 'Escape'){ e.preventDefault(); togglePausa(); return; }
  if(T.pausado) return;
  if(T.especial && (k === ' ' || k === 'Enter')){ e.preventDefault(); if(T.pular) T.pular(); return; }
  if((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); desfazer(); return; }
  if(e.target.tagName === 'BUTTON' && (k === ' ' || k === 'Enter') && !['validacao'].includes(S.fase)) return;
  const n = /^[0-9]$/.test(k) ? (+k || 10) : 0, ok = k === ' ' || k === 'Enter', j = atual(), d = S.duelo;
  let usou = true;
  switch(S.fase){
    case 'inicio': if(ok) irOponente(); else usou = false; break;
    case 'oponente': { const l = listaOponentes(j); if(n && l[n-1]) escolherOponente(l[n-1].id); else usou = false; break; }
    case 'categoria': if(n && CAT_IDS[n-1]) escolherCategoria(CAT_IDS[n-1]); else usou = false; break;
    case 'categoria_imposta': if(ok) confirmarCategoria(); else usou = false; break;
    case 'dificuldade': if(n >= 1 && n <= 3) escolherDificuldade(n); else usou = false; break;
    case 'pergunta': { const q = d.tipo === 'todos' ? ativos() : [jog(d.desafiante), jog(d.desafiado)]; if(n && q[n-1]) marcar(q[n-1].id); else usou = false; break; }
    case 'resposta': if(ok) revelar(); else if(k === 'Backspace') voltarMarcacao(); else usou = false; break;
    case 'validacao': if(k === 'Enter') validar(true); else if(k === 'Backspace') validar(false); else usou = false; break;
    case 'erro_rebote': if(ok) fazerRebote(); else if(k === 'Backspace') pularRebote(); else usou = false; break;
    case 'resultado': case 'tempo_esgotado': case 'congelado': if(ok) acoes.proximo(); else usou = false; break;
    default: usou = false;
  }
  if(usou) e.preventDefault();
});

ajustar(); render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(!T.ocupado) render(); });
</script>
